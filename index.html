<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Botfusion AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f172a;
  --panel:#020617;
  --text:#e5e7eb;
  --accent:#3b82f6;
}
.light{
  --bg:#f8fafc;
  --panel:#e5e7eb;
  --text:#020617;
}

*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* Sidebar */
#sidebar{
  width:260px;
  background:var(--panel);
  padding:15px;
  display:flex;
  flex-direction:column;
}
#sidebar h2{margin:0 0 10px}
.btn{
  padding:10px;
  margin:5px 0;
  border:none;
  background:var(--accent);
  color:white;
  border-radius:6px;
  cursor:pointer;
}
.history{
  flex:1;
  overflow:auto;
}
.history div{
  padding:8px;
  margin-bottom:5px;
  background:#1e293b;
  border-radius:5px;
  cursor:pointer;
}

/* Main */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}
#topbar{
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #334155;
}
#chat{
  flex:1;
  padding:15px;
  overflow:auto;
}
.msg{
  margin-bottom:10px;
}
.user{color:#60a5fa}
.bot{color:#34d399}

/* Input */
#inputBar{
  display:flex;
  padding:10px;
  gap:10px;
  border-top:1px solid #334155;
}
#input{
  flex:1;
  padding:10px;
  border-radius:6px;
  border:none;
}
.iconBtn{
  background:var(--accent);
  border:none;
  padding:10px;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

/* Modals */
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
}
.modalContent{
  background:var(--panel);
  padding:20px;
  border-radius:10px;
  width:300px;
}
.modalContent h3{margin-top:0}
.modalContent button{width:100%;margin-top:10px}
</style>
</head>

<body>
<!-- SIDEBAR -->
<div id="sidebar">
  <h2>🤖 Botfusion</h2>
  <button class="btn" onclick="newChat()">➕ New Chat</button>
  <button class="btn" onclick="openSettings()">⚙ Settings</button>
  <button class="btn">🔐 Google Login</button>

  <div class="history" id="history"></div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <b>Botfusion AI</b>
    <span>Online</span>
  </div>

  <div id="chat"></div>

  <div id="inputBar">
    <input type="file" id="file" hidden>
    <button class="iconBtn" onclick="file.click()">📎</button>
    <input id="input" placeholder="Type a message..." oninput="typing()">
    <button class="iconBtn" onclick="send()">➡</button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settings">
  <div class="modalContent">
    <h3>Settings</h3>
    <button onclick="toggleTheme()">🌗 Theme</button>
    <button>🌐 Language</button>
    <button onclick="alert('Botfusion AI\nCreated by Atharv Pawar')">ℹ About Botfusion</button>
    <button onclick="alert('Help coming soon')">❓ Help</button>
    <button onclick="alert('Report sent')">🚨 Report</button>
    <button onclick="closeSettings()">❌ Close</button>
  </div>
</div>

<script>
let chatStarted=false;
let chatCount=0;

function typing(){
  if(!chatStarted){
    chatStarted=true;
    document.getElementById("chat").innerHTML="";
  }
}

function send(){
  const input=document.getElementById("input");
  if(!input.value)return;
  addMsg("user",input.value);
  setTimeout(()=>addMsg("bot","This is a demo reply."),500);
  input.value="";
}

function addMsg(type,text){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=(type==="user"?"You: ":"Bot: ")+text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function newChat(){
  chatStarted=false;
  chat.innerHTML="<p>Start typing to begin a new chat…</p>";
  chatCount++;
  const h=document.createElement("div");
  h.textContent="Chat "+chatCount;
  history.prepend(h);
}

function openSettings(){settings.style.display="flex"}
function closeSettings(){settings.style.display="none"}
function toggleTheme(){document.body.classList.toggle("light")}
</script>

</body>
</html>
