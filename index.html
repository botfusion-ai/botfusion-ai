<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
:root{
 --bg:#121212;--panel:#1e1e1e;--text:#fff;--accent:#10a37f;
}
[data-theme="blue"]{--accent:#3b82f6}
[data-theme="purple"]{--accent:#8b5cf6}
[data-theme="red"]{--accent:#ef4444}
[data-theme="gold"]{--accent:#facc15}

*{box-sizing:border-box;margin:0;font-family:system-ui}
body{background:var(--bg);color:var(--text);height:100vh;display:flex}

/* Sidebar */
.sidebar{
 width:260px;background:#0d0d0d;padding:16px;
 display:none;flex-direction:column
}
.sidebar h2{margin-bottom:10px}
.sidebar select,.sidebar button{
 margin:6px 0;padding:8px;border-radius:6px;border:none
}

/* Main */
.main{flex:1;display:flex;flex-direction:column}
.topbar{
 height:56px;display:flex;align-items:center;
 padding:0 16px;border-bottom:1px solid #222
}
.menu{cursor:pointer}
.title{margin-left:12px;font-weight:600}
.auth{margin-left:auto}

/* Center */
.center{
 flex:1;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center
}
.logo{font-size:64px;color:var(--accent)}
.cards{max-width:520px;width:100%;margin-top:20px}
.card{
 background:var(--panel);padding:14px;
 border-radius:12px;margin-bottom:12px;
 cursor:pointer;opacity:.85
}

/* Chat */
.chat{flex:1;overflow:auto;padding:16px;display:none}
.msg{max-width:75%;margin-bottom:10px;padding:10px;border-radius:10px}
.user{background:var(--accent);color:#000;margin-left:auto}
.bot{background:var(--panel)}

/* Input */
.inputbar{border-top:1px solid #222;padding:14px}
.inputwrap{
 display:flex;align-items:center;
 background:var(--panel);border-radius:24px;padding:10px
}
.inputwrap input{
 flex:1;background:none;border:none;color:white;font-size:16px;outline:none
}
.icon{cursor:pointer;margin-left:10px}

/* Buttons */
button{
 background:var(--accent);border:none;
 padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
<h2>BotFusion</h2>
<p id="userEmail"></p>

<label>Theme</label>
<select onchange="setTheme(this.value)">
 <option value="">Green</option>
 <option value="blue">Blue</option>
 <option value="purple">Purple</option>
 <option value="red">Red</option>
 <option value="gold">Gold</option>
</select>

<label>Language</label>
<select onchange="setLang(this.value)">
 <option value="en">English</option>
 <option value="hi">Hindi</option>
 <option value="mr">Marathi</option>
 <option value="fr">French</option>
 <option value="es">Spanish</option>
</select>

<button onclick="logout()">Logout</button>
</div>

<!-- Main -->
<div class="main">
<div class="topbar">
 <span class="material-icons menu" onclick="toggleSidebar()">menu</span>
 <span class="title">BotFusion</span>
 <div class="auth">
  <button onclick="login()" id="loginBtn">Google Login</button>
 </div>
</div>

<div class="center" id="home">
 <div class="logo">⬢</div>
 <h2 id="headline">How can I help you today?</h2>

 <div class="cards">
  <div class="card" onclick="quick('Explain quantum computing')">Explain quantum computing</div>
  <div class="card" onclick="quick('Write a robot story')">Write a robot story</div>
  <div class="card" onclick="quick('Debug my code')">Help me debug my code</div>
  <div class="card" onclick="quick('Learn a new language')">How to learn a new language?</div>
 </div>
</div>

<div class="chat" id="chat"></div>

<div class="inputbar">
<div class="inputwrap">
 <input id="input" placeholder="Message BotFusion...">
 <span class="material-icons icon" onclick="voice()">mic</span>
 <span class="material-icons icon" onclick="send()">arrow_upward</span>
</div>
</div>
</div>

<script>
/* 🔥 Firebase Config (REPLACE) */
firebase.initializeApp({
apiKey: "AIzaSyDA62eN5MEjX9Z-gw6w9UuR8L-Ke_6J7eE",
  authDomain: "botfusion-ai-bd6d0.firebaseapp.com",
  projectId: "botfusion-ai-bd6d0",
  storageBucket: "botfusion-ai-bd6d0.firebasestorage.app",
  messagingSenderId: "730477136598",
  appId: "1:730477136598:web:c6b4e0d495744d12079777",
  measurementId: "G-53FTWNQB8X"
});
const auth=firebase.auth();
const provider=new firebase.auth.GoogleAuthProvider();

/* Auth */
function login(){auth.signInWithPopup(provider)}
function logout(){auth.signOut()}
auth.onAuthStateChanged(u=>{
 document.getElementById("loginBtn").style.display=u?"none":"block";
 document.getElementById("sidebar").style.display=u?"flex":"none";
 if(u) document.getElementById("userEmail").innerText=u.email;
})

/* Sidebar */
function toggleSidebar(){
 sidebar.style.display=sidebar.style.display==="flex"?"none":"flex"
}

/* Themes */
function setTheme(t){
 document.documentElement.dataset.theme=t;
 localStorage.theme=t
}
if(localStorage.theme) setTheme(localStorage.theme)

/* Language */
const text={
 hi:"मैं आपकी कैसे मदद कर सकता हूँ?",
 mr:"मी तुम्हाला कशी मदत करू?",
 fr:"Comment puis-je vous aider?",
 es:"¿Cómo puedo ayudarte?"
}
function setLang(l){
 headline.innerText=text[l]||"How can I help you today?"
 localStorage.lang=l
}
if(localStorage.lang) setLang(localStorage.lang)

/* Chat */
function quick(t){input.value=t;send()}
function send(){
 if(!input.value) return
 home.style.display="none";chat.style.display="block"
 chat.innerHTML+=`<div class="msg user">${input.value}</div>`
 chat.innerHTML+=`<div class="msg bot">BotFusion is thinking...</div>`
 input.value=""
 chat.scrollTop=chat.scrollHeight
}

/* Voice */
function voice(){
 const r=new webkitSpeechRecognition()
 r.lang="en-US";r.start()
 r.onresult=e=>input.value=e.results[0][0].transcript
}
</script>

</body>
</html>
