<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BotFusion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#1f1f1f;
  --card:#2a2a2a;
  --text:#ffffff;
  --sub:#b5b5b5;
  --accent:#16a085;
}
.light{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#111;
  --sub:#555;
}

*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  background:var(--accent);
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
}
.menu{font-size:22px;cursor:pointer}
.title{font-weight:600}

/* DRAWER */
#drawer{
  position:fixed;
  inset:0 30% 0 0;
  background:var(--card);
  padding:20px;
  display:none;
  z-index:10;
}
.drawer-btn{
  display:block;
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  background:var(--accent);
  color:#fff;
  border-radius:6px;
}

/* HOME */
#home{
  text-align:center;
  padding:40px 16px;
}
.logo{
  font-size:60px;
  color:var(--accent);
}
.suggestion{
  background:var(--card);
  padding:14px;
  margin:10px auto;
  border-radius:12px;
  max-width:360px;
  text-align:left;
  color:var(--sub);
}

/* CHAT */
#chat{
  display:none;
  padding:15px;
  padding-bottom:90px;
}
.msg{margin-bottom:10px}
.user{color:#4ade80}
.bot{color:#60a5fa}

/* INPUT */
#inputBar{
  position:fixed;
  bottom:0;
  width:100%;
  padding:12px;
  background:var(--bg);
  display:flex;
  gap:10px;
}
#input{
  flex:1;
  padding:14px;
  border-radius:25px;
  border:none;
  background:var(--card);
  color:var(--text);
}
.icon{
  background:var(--card);
  border:none;
  padding:14px;
  border-radius:50%;
  color:var(--text);
}
</style>
</head>

<body>

<header>
  <span class="menu" onclick="drawer.style.display='block'">☰</span>
  <span class="title">BotFusion</span>
</header>

<!-- DRAWER -->
<div id="drawer">
  <h3>Settings</h3>
  <button class="drawer-btn" onclick="toggleTheme()">🌗 Theme</button>
  <button class="drawer-btn" onclick="toggleLang()">🌐 Language</button>
  <button class="drawer-btn" onclick="alert('BotFusion AI\nCreated by Atharv Pawar')">ℹ About</button>
  <button class="drawer-btn" onclick="drawer.style.display='none'">❌ Close</button>
</div>

<!-- HOME -->
<div id="home">
  <div class="logo">⬡</div>
  <h2 id="helpText">How can I help you today?</h2>

  <div class="suggestion" onclick="quick('Explain quantum computing in simple terms')">
    ℹ Explain quantum computing in simple terms
  </div>
  <div class="suggestion" onclick="quick('Write a creative story about a robot')">
    ✏ Write a creative story about a robot
  </div>
  <div class="suggestion" onclick="quick('Help me debug my code')">
    &lt;/&gt; Help me debug my code
  </div>
  <div class="suggestion" onclick="quick('Best way to learn a new language')">
    🌍 What's the best way to learn a new language?
  </div>
</div>

<!-- CHAT -->
<div id="chat"></div>

<!-- INPUT -->
<div id="inputBar">
  <input type="file" hidden id="file">
  <button class="icon" onclick="file.click()">📎</button>
  <input id="input" placeholder="Message BotFusion…" oninput="startChat()">
  <button class="icon" onclick="send()">⬆</button>
</div>

<script>
let started=false;
let lang="en";

function startChat(){
  if(!started){
    started=true;
    home.style.display="none";
    chat.style.display="block";
  }
}

function send(){
  if(!input.value)return;
  add("user",input.value);
  setTimeout(()=>add("bot","This is a demo response."),500);
  input.value="";
}

function add(type,text){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.textContent=(type==="user"?"You: ":"Bot: ")+text;
  chat.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);
}

function quick(text){
  startChat();
  input.value=text;
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

function toggleLang(){
  lang = lang==="en"?"hi":"en";
  helpText.textContent = lang==="en"
    ? "How can I help you today?"
    : "मैं आपकी कैसे मदद कर सकता हूँ?";
}
</script>

</body>
</html>
