<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<style>
:root{
  --bg:#121212;
  --panel:#1e1e1e;
  --panel2:#232323;
  --accent:#19c37d;
  --text:#e5e5e5;
  --muted:#9a9a9a;
}
*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;left:0;
  width:260px;
  height:100vh;
  background:#181818;
  padding:15px;
  transform:translateX(-100%);
  transition:.3s ease;
  z-index:1000;
}
.sidebar.open{transform:translateX(0);}
.sidebar h3{color:var(--accent)}
.side-item{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:8px;
}
.side-item:hover{background:#2a2a2a}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  z-index:900;
}
.overlay.show{display:block}

/* MAIN */
.main{height:100vh;display:flex;flex-direction:column}

/* HEADER */
.header{
  height:56px;
  background:#181818;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:15px;
}
.hamburger{font-size:22px;cursor:pointer}
.logo span{color:var(--accent)}

/* CHAT */
.chat{
  flex:1;
  padding:25px 15px 120px;
  text-align:center;
}
.hero-icon{
  width:60px;height:60px;
  margin:60px auto 20px;
  background:var(--accent);
  border-radius:12px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.suggestion{
  background:var(--panel2);
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
  cursor:pointer;
  text-align:left;
}

/* INPUT */
.input-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#181818;
  padding:12px;
}
.input-wrap{
  background:var(--panel2);
  border-radius:25px;
  display:flex;
  align-items:center;
  padding:8px 12px;
  gap:10px;
}
.input-wrap input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:white;
}
.send{
  background:var(--accent);
  border:none;
  width:36px;height:36px;
  border-radius:50%;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>BotFusion</h3>

  <div class="side-item" onclick="googleLogin()">🔐 Google Login</div>
  <div class="side-item">➕ New Chat</div>
  <div class="side-item">⚙️ Settings</div>
  <div class="side-item">🚪 Logout</div>

  <p style="font-size:12px;color:#aaa;margin-top:20px">
    BotFusion AI does not provide illegal or harmful content.
  </p>
</div>

<div class="overlay" id="overlay"></div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div class="hamburger" id="menuBtn">☰</div>
    <div class="logo"><span>⬢</span> BotFusion</div>
  </div>

  <div class="chat">
    <div class="hero-icon"></div>
    <h2>How can I help you today?</h2>

    <div class="suggestion">Explain quantum computing in simple terms</div>
    <div class="suggestion">Write a creative story about a robot</div>
    <div class="suggestion">Help me debug my code</div>
  </div>

  <div class="input-bar">
    <div class="input-wrap">
      <button onclick="file.click()">📎</button>
      <input type="file" id="file" hidden>
      <input placeholder="Message BotFusion...">
      <button class="send">↑</button>
    </div>
  </div>

</div>

<script>
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

menuBtn.onclick=()=>{
  sidebar.classList.add("open");
  overlay.classList.add("show");
}
overlay.onclick=()=>{
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

function googleLogin(){
  window.location.href="http://localhost:5000/api/auth/google";
}
</script>

</body>
</html>
