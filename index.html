<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOTFUSION AI</title>

<!-- Inter Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<style>
:root{
--bg:#0b0f14;
--surface:#11161d;
--surface-2:#151b23;
--border:rgba(255,255,255,0.06);
--text:#ffffff;
--text-muted:#9aa4b2;
--accent:#4f8cff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
overflow:hidden;
}

/* Sidebar */
.sidebar{
position:fixed;
left:-270px;
top:0;
width:270px;
height:100%;
background:var(--surface);
border-right:1px solid var(--border);
transition:.3s ease;
padding:20px;
z-index:200;
}

.sidebar.active{ left:0; }

.sidebar h2{
font-size:16px;
margin-bottom:20px;
font-weight:600;
}

.sidebar button{
width:100%;
background:var(--surface-2);
border:1px solid var(--border);
color:var(--text);
padding:10px;
border-radius:8px;
margin-bottom:10px;
cursor:pointer;
}

/* Main Layout */
.main{
flex:1;
display:flex;
flex-direction:column;
width:100%;
}

/* Header */
.header{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid var(--border);
background:var(--surface);
}

.header h1{
font-size:16px;
font-weight:600;
letter-spacing:.5px;
}

/* Icon Buttons */
.icon-btn{
width:40px;
height:40px;
border-radius:10px;
background:transparent;
border:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
color:var(--text-muted);
transition:.2s;
}

.icon-btn:hover{
background:var(--surface-2);
color:var(--text);
}

/* Chat */
.chat{
flex:1;
overflow-y:auto;
padding:40px 20px 120px 20px;
max-width:840px;
margin:auto;
width:100%;
}

.message{
margin-bottom:20px;
padding:14px 18px;
border-radius:12px;
max-width:75%;
font-size:14px;
line-height:1.6;
animation:fadeIn .2s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(5px);}
to{opacity:1;transform:translateY(0);}
}

.user{
background:var(--accent);
color:white;
margin-left:auto;
}

.ai{
background:var(--surface-2);
border:1px solid var(--border);
}

/* Floating Input */
.input-wrapper{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:840px;
background:var(--surface);
border:1px solid var(--border);
border-radius:18px;
display:flex;
align-items:center;
padding:8px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.input-wrapper input{
flex:1;
background:transparent;
border:none;
outline:none;
color:var(--text);
padding:10px;
font-size:14px;
}

.input-wrapper button{
width:40px;
height:40px;
border-radius:10px;
border:none;
background:transparent;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
color:var(--text-muted);
}

.input-wrapper button:hover{
background:var(--surface-2);
color:var(--text);
}

/* Settings Panel */
.settings{
position:fixed;
right:-330px;
top:0;
width:330px;
height:100%;
background:var(--surface);
border-left:1px solid var(--border);
padding:20px;
transition:.3s;
z-index:200;
overflow-y:auto;
}

.settings.active{ right:0; }

.settings h2{
font-size:16px;
margin-bottom:20px;
}

.settings select,
.settings button{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:8px;
border:1px solid var(--border);
background:var(--surface-2);
color:var(--text);
cursor:pointer;
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
<h2>Chats</h2>
<button onclick="newChat()">New Chat</button>
<button onclick="renameChat()">Rename</button>
<button onclick="toggleSidebar()">Close</button>
<div id="history"></div>
</div>

<div class="main">

<div class="header">
<button class="icon-btn" onclick="toggleSidebar()">
<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
<path d="M3 6h18M3 12h18M3 18h18"/>
</svg>
</button>

<h1>BOTFUSION AI</h1>

<div style="display:flex;gap:8px;">
<button class="icon-btn" onclick="toggleSettings()">
<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/>
</svg>
</button>
<button class="icon-btn" onclick="googleLogin()">
<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 12a5 5 0 100-10 5 5 0 000 10zM4 22a8 8 0 0116 0"/>
</svg>
</button>
</div>
</div>

<div class="chat" id="chat">
<div class="message ai">Welcome to BOTFUSION AI.</div>
</div>

</div>

<!-- Floating Input -->
<div class="input-wrapper">
<input type="file" id="fileInput" hidden>

<button onclick="document.getElementById('fileInput').click()">
<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
</svg>
</button>

<input type="text" id="messageInput" placeholder="Type your message...">

<button onclick="startVoice()">
<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 1a3 3 0 013 3v8a3 3 0 01-6 0V4a3 3 0 013-3z"/>
</svg>
</button>

<button onclick="sendMessage()">
<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
<path d="M2 12l19-9-5 9 5 9-19-9z"/>
</svg>
</button>
</div>

<!-- Settings -->
<div class="settings" id="settings">
<h2>Settings</h2>

<select onchange="changeTheme(this.value)">
<option value="default">Corporate Black</option>
<option value="blue">Blue</option>
<option value="green">Green</option>
<option value="purple">Purple</option>
<option value="gray">Gray</option>
</select>

<select id="languageSelect"></select>

<button onclick="alert('Report sent')">Report Issue</button>
<button onclick="logout()">Logout</button>
<button onclick="toggleSettings()">Close</button>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDA62eN5MEjX9Z-gw6w9UuR8L-Ke_6J7eE",
authDomain: "botfusion-ai-bd6d0.firebaseapp.com",
projectId: "botfusion-ai-bd6d0",
storageBucket: "botfusion-ai-bd6d0.firebasestorage.app",
messagingSenderId: "730477136598",
appId: "1:730477136598:web:c6b4e0d495744d12079777"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

function googleLogin(){ auth.signInWithPopup(provider); }
function logout(){ auth.signOut(); }

function toggleSidebar(){ sidebar.classList.toggle('active'); }
function toggleSettings(){ settings.classList.toggle('active'); }

function sendMessage(){
const input=messageInput;
if(!input.value)return;
const user=document.createElement('div');
user.className='message user';
user.innerText=input.value;
chat.appendChild(user);

const ai=document.createElement('div');
ai.className='message ai';
ai.innerText="AI response coming from backend tomorrow.";
chat.appendChild(ai);

input.value="";
chat.scrollTop=chat.scrollHeight;
}

function newChat(){ chat.innerHTML=""; }
function renameChat(){ alert("Rename enabled in backend phase."); }

function startVoice(){
const rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.onresult=e=>{ messageInput.value=e.results[0][0].transcript; };
rec.start();
}

function changeTheme(theme){
const root=document.documentElement;
if(theme==="blue") root.style.setProperty('--accent','#3b82f6');
if(theme==="green") root.style.setProperty('--accent','#22c55e');
if(theme==="purple") root.style.setProperty('--accent','#a855f7');
if(theme==="gray") root.style.setProperty('--accent','#64748b');
if(theme==="default") root.style.setProperty('--accent','#4f8cff');
}

/* 100+ languages */
const languages=["English","Hindi","Spanish","French","German","Arabic","Chinese","Japanese","Korean"];
while(languages.length<110){languages.push("Language "+languages.length);}
languages.forEach(l=>{
const opt=document.createElement("option");
opt.textContent=l;
languageSelect.appendChild(opt);
});
</script>

</body>
  </html>
