<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotFusion AI</title>

<style>
/* ================= ROOT THEMES ================= */
:root{
  --bg:#0f0f0f;
  --panel:#1a1a1a;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#242424;
}

body.light{--bg:#f5f5f5;--panel:#ffffff;--text:#000;--card:#eaeaea;}
body.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
body.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
body.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
body.black{--bg:#000;--panel:#111;}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */
.header{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  background:#111;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* ================= SIDEBAR ================= */
.sidebar{
  position:fixed;
  top:0;
  left:-100%;
  width:260px;
  height:100%;
  background:var(--panel);
  padding:16px;
  transition:0.3s ease;
  z-index:1000;
}

.sidebar.active{ left:0; }

.sidebar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  font-size:20px;
  cursor:pointer;
}

.sidebar button, .sidebar select{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#333;
  color:white;
  cursor:pointer;
}

.sidebar h4{
  margin-top:20px;
  margin-bottom:8px;
  font-size:14px;
  opacity:.7;
}

/* ================= MAIN ================= */
.main{
  flex:1;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.welcome{
  text-align:center;
}

.welcome h2{
  margin:12px 0;
}

/* ================= CHAT ================= */
.chat-area{
  width:100%;
  max-width:600px;
  display:none;
  flex-direction:column;
  gap:12px;
}

.message{
  background:var(--card);
  padding:12px;
  border-radius:12px;
}

/* ================= FOOTER ================= */
.footer{
  padding:12px;
  background:#111;
  display:flex;
  align-items:center;
  gap:10px;
}

.upload-btn{
  font-size:20px;
  cursor:pointer;
}

.footer input{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
}

.footer button{
  background:var(--accent);
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body class="black">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <strong>BotFusion AI</strong>
    <span class="close-btn" onclick="toggleSidebar()">✕</span>
  </div>

  <button onclick="newChat()">➕ New Chat</button>
  <button>🕘 History</button>
  <button>📄 Report</button>

  <h4>Settings</h4>
  <select onchange="setTheme(this.value)">
    <option value="">Dark (Default)</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <select>
    <option>🌐 Language</option>
    <option>English</option>
    <option>Hindi</option>
    <option>Marathi</option>
  </select>

  <button>ℹ️ About BotFusion</button>
  <button>❓ Help</button>
  <button onclick="googleLogin()">🔐 Google Login</button>

  <p style="font-size:12px;opacity:.6;margin-top:10px">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="menu-btn" onclick="toggleSidebar()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
  <div class="welcome" id="welcome">
    <h2>How can I help you today?</h2>
    <p>Ask anything, upload files, or start a new chat.</p>
  </div>

  <div class="chat-area" id="chatArea"></div>
</div>

<!-- ================= FOOTER ================= -->
<div class="footer">
  <span class="upload-btn">📎</span>
  <input id="chatInput" placeholder="Message BotFusion..." oninput="startChat()"/>
  <button>↑</button>
</div>

<script>
const chatArea = document.getElementById("chatArea");
const chatInput = document.getElementById("chatInput");

async function sendMessage() {
  const message = chatInput.value.trim();
  if (!message) return;

  startChat();

  // User message
  chatArea.innerHTML += `
    <div class="message"><strong>You:</strong> ${message}</div>
  `;

  chatInput.value = "";

  try {
    const res = await fetch("http://localhost:5000/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    chatArea.innerHTML += `
      <div class="message"><strong>BotFusion:</strong> ${data.reply}</div>
    `;

    chatArea.scrollTop = chatArea.scrollHeight;

  } catch (err) {
    chatArea.innerHTML += `
      <div class="message">❌ Server not reachable</div>
    `;
  }
}

document.querySelector(".footer button").onclick = sendMessage;
</script>
  
</body>
</html>
