<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<style>
/* ================= ROOT THEMES ================= */
:root{
  --bg:#1e1e1e;
  --panel:#2a2a2a;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#2f2f2f;
}

.light{--bg:#f4f4f4;--panel:#ffffff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ================= HEADER ================= */
.header{
  display:flex;
  align-items:center;
  padding:14px;
  background:#111;
}

.menu-btn{
  font-size:24px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* ================= SIDEBAR ================= */
.sidebar{
  position:fixed;
  top:0;
  left:-100%;
  width:260px;
  height:100%;
  background:var(--panel);
  padding:20px;
  transition:0.3s ease;
  z-index:1001;
}

.sidebar.active{
  left:0;
}

.sidebar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  font-size:22px;
  cursor:pointer;
}

.sidebar button,
.sidebar select,
.sidebar input{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3a3a3a;
  color:white;
}

/* ================= OVERLAY ================= */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:1000;
}

.overlay.active{
  display:block;
}

/* ================= CHAT ================= */
.main{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.chat-box{
  max-width:520px;
  margin:auto;
}

.message{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}

.user{
  background:#3b82f6;
  text-align:right;
}

.bot{
  background:var(--card);
}

/* ================= FOOTER ================= */
.footer{
  padding:12px;
  background:#111;
  display:flex;
  align-items:center;
  gap:8px;
}

.upload-btn{
  font-size:20px;
  cursor:pointer;
}

.footer input[type=text]{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
}

.footer button{
  background:var(--accent);
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>BotFusion AI</h3>
    <span class="close-btn" onclick="closeMenu()">✖</span>
  </div>

  <button onclick="googleLogin()">Google Login</button>

  <label>Theme</label>
  <select onchange="setTheme(this.value)">
    <option value="">Default</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <label>Language</label>
  <select>
    <option>English</option>
    <option>Hindi</option>
    <option>Marathi</option>
    <option>Spanish</option>
    <option>French</option>
  </select>

  <button onclick="alert('Report submitted')">Report</button>

  <p style="font-size:12px;opacity:.7">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="openMenu()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- CHAT -->
<div class="main" id="chat">
  <div class="chat-box" id="chatBox">
    <div class="message bot">How can I help you today?</div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <label class="upload-btn">📎
    <input type="file" hidden>
  </label>

  <input id="input" type="text" placeholder="Message BotFusion...">
  <button onclick="send()">↑</button>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("input");

function openMenu(){
  sidebar.classList.add("active");
  overlay.classList.add("active");
}
function closeMenu(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}
function setTheme(t){
  document.body.className = t;
}
function googleLogin(){
  window.location.href = "http://localhost:5000/api/auth/google";
}

/* CHAT */
async function send(){
  const text = input.value.trim();
  if(!text) return;

  add("user", text);
  input.value="";

  try{
    const res = await fetch("http://localhost:5000/api/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ message:text })
    });
    const data = await res.json();
    add("bot", data.reply || "No response");
  }catch{
    add("bot","Server error");
  }
}

function add(role,text){
  const div = document.createElement("div");
  div.className = "message " + role;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
