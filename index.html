<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<style>
:root{
--bg:#101518;
--panel:#161c22;
--primary:#5b8cff;
--text:#ffffff;
--muted:#8b949e;
--border:#1f262c;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* HEADER */
.header{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
background:var(--panel);
border-bottom:1px solid var(--border);
font-weight:600;
}

.icon-btn{
background:none;
border:none;
color:var(--text);
cursor:pointer;
font-size:20px;
padding:6px;
border-radius:8px;
transition:.2s;
}

.icon-btn:hover{
background:rgba(255,255,255,0.05);
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:var(--panel);
transition:.3s;
padding:20px;
z-index:100;
border-right:1px solid var(--border);
}

.sidebar.active{
left:0;
}

.sidebar-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:12px 0;
cursor:pointer;
color:var(--muted);
}

.sidebar li:hover{
color:var(--primary);
}

/* SETTINGS */
.settings{
position:fixed;
top:0;
right:-260px;
width:260px;
height:100%;
background:var(--panel);
transition:.3s;
padding:20px;
z-index:110;
border-left:1px solid var(--border);
}

.settings.active{
right:0;
}

.settings select{
width:100%;
padding:8px;
border-radius:8px;
background:#1f252c;
border:none;
color:white;
margin-bottom:20px;
}

/* CHAT */
.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
max-width:75%;
padding:12px 16px;
border-radius:16px;
font-size:14px;
line-height:1.5;
animation:fadeIn .2s ease;
}

.user{
align-self:flex-end;
background:var(--primary);
color:white;
}

.bot{
align-self:flex-start;
background:#1f252c;
}

.typing{
font-size:13px;
color:var(--muted);
padding-left:5px;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(5px);}
to{opacity:1;transform:translateY(0);}
}

/* INPUT */
.input-bar{
height:60px;
display:flex;
align-items:center;
padding:0 10px;
gap:8px;
background:var(--panel);
border-top:1px solid var(--border);
}

.input-bar input{
flex:1;
height:40px;
border:none;
outline:none;
background:#1f252c;
color:white;
border-radius:10px;
padding:0 12px;
font-size:14px;
}

/* THEMES */
.theme-gold{--primary:#d4af37;}
.theme-purple{--primary:#9b5cff;}
.theme-teal{--primary:#00c2a8;}
.theme-rose{--primary:#ff4f81;}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<button class="icon-btn" onclick="toggleSidebar()">☰</button>
<div>BotFusion AI</div>
<button class="icon-btn" onclick="toggleSettings()">⚙</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<div class="sidebar-header">
<strong>Menu</strong>
<button class="icon-btn" onclick="toggleSidebar()">✕</button>
</div>
<ul>
<li onclick="newChat()">New Chat</li>
<li>Google Login</li>
<li>Guest Mode</li>
<li>Report Issue</li>
</ul>
</div>

<!-- SETTINGS -->
<div class="settings" id="settings">
<div class="sidebar-header">
<strong>Settings</strong>
<button class="icon-btn" onclick="toggleSettings()">✕</button>
</div>

<h4>Theme</h4>
<select onchange="changeTheme(this.value)">
<option value="">Default</option>
<option value="theme-gold">Gold</option>
<option value="theme-purple">Purple</option>
<option value="theme-teal">Teal</option>
<option value="theme-rose">Rose</option>
</select>

<h4>Language</h4>
<select id="languageSelect"></select>

</div>

<!-- CHAT -->
<div class="chat" id="chat">
<div class="message bot">Welcome to BotFusion AI</div>
</div>

<!-- INPUT -->
<div class="input-bar">
<input type="file" id="fileUpload" hidden>
<button class="icon-btn" onclick="document.getElementById('fileUpload').click()">📎</button>

<input type="text" id="msg" placeholder="Ask anything...">

<button class="icon-btn" onclick="startVoice()">🎤</button>
<button class="icon-btn" onclick="sendMessage()">➤</button>
</div>

<script>

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("active");
}

function toggleSettings(){
document.getElementById("settings").classList.toggle("active");
}

function newChat(){
document.getElementById("chat").innerHTML=
'<div class="message bot">New conversation started.</div>';
toggleSidebar();
}

function sendMessage(){
let input=document.getElementById("msg");
if(!input.value.trim()) return;

let chat=document.getElementById("chat");

let user=document.createElement("div");
user.className="message user";
user.innerText=input.value;

chat.appendChild(user);

input.value="";
chat.scrollTop=chat.scrollHeight;

showTyping();

setTimeout(()=>{
removeTyping();
let bot=document.createElement("div");
bot.className="message bot";
bot.innerText="This is a smart response from BotFusion AI.";
chat.appendChild(bot);
chat.scrollTop=chat.scrollHeight;
},1200);
}

function showTyping(){
let chat=document.getElementById("chat");
let typing=document.createElement("div");
typing.className="typing";
typing.id="typing";
typing.innerText="BotFusion is typing...";
chat.appendChild(typing);
}

function removeTyping(){
let typing=document.getElementById("typing");
if(typing) typing.remove();
}

function changeTheme(theme){
document.body.className=theme;
}

let langs=Intl.supportedValuesOf("language");
let select=document.getElementById("languageSelect");
langs.forEach(l=>{
let opt=document.createElement("option");
opt.value=l;
opt.textContent=l;
select.appendChild(opt);
});

function startVoice(){
if(!('webkitSpeechRecognition' in window)) return alert("Voice not supported");
let rec=new webkitSpeechRecognition();
rec.lang="en-US";
rec.start();
rec.onresult=e=>{
document.getElementById("msg").value=e.results[0][0].transcript;
};
}

document.getElementById("msg").addEventListener("keypress",function(e){
if(e.key==="Enter") sendMessage();
});

</script>

</body>
 </html>
