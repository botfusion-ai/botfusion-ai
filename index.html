<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --panel:#1a1a22;
  --text:#ffffff;
  --sub:#9aa0a6;
  --accent:#2f81f7;
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
  overflow:hidden;
  transition:background .3s;
}

/* Sidebar */
.sidebar{
  position:fixed;
  left:-280px;
  width:260px;
  height:100%;
  background:var(--panel);
  transition:.35s;
  padding:20px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.sidebar.open{
  left:0;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.menu-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}
.menu-item:hover{
  background:rgba(255,255,255,0.05);
}

header{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 20px;
  background:var(--panel);
  flex-shrink:0;
}

.hamburger{
  width:25px;
  height:18px;
  cursor:pointer;
  position:relative;
}
.hamburger span{
  position:absolute;
  height:3px;
  width:100%;
  background:white;
  border-radius:3px;
  transition:.3s;
}
.hamburger span:nth-child(1){top:0}
.hamburger span:nth-child(2){top:7px}
.hamburger span:nth-child(3){bottom:0}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.message{
  max-width:75%;
  padding:12px 16px;
  border-radius:14px;
  font-size:14px;
  line-height:1.5;
}

.user{
  background:var(--accent);
  align-self:flex-end;
}
.bot{
  background:var(--panel);
  align-self:flex-start;
}

.input-area{
  padding:15px;
  background:var(--panel);
  display:flex;
  gap:10px;
}

textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  border-radius:10px;
  padding:10px;
  font-family:inherit;
  background:#262631;
  color:white;
}

button{
  border:none;
  background:var(--accent);
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}

select{
  padding:6px;
  border-radius:6px;
  border:none;
}

.hidden{
  display:none;
}

/* Themes */
.theme-light{
  --bg:#f5f5f5;
  --panel:#ffffff;
  --text:#000;
  --sub:#555;
  --accent:#0066ff;
}
.theme-blue{
  --bg:#0e1628;
  --panel:#172033;
  --accent:#1f6feb;
}
.theme-green{
  --bg:#0e1c16;
  --panel:#162821;
  --accent:#2ea043;
}
.theme-purple{
  --bg:#1a1028;
  --panel:#24153a;
  --accent:#a371f7;
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <div class="menu-item" onclick="newChat()">New Chat</div>
  <div class="menu-item" onclick="showAccount()">Account</div>
  <div class="menu-item" onclick="showSettings()">Settings</div>
  <div class="menu-item" onclick="showReport()">Report</div>
  <div>
    <strong>Themes</strong>
    <div class="menu-item" onclick="setTheme('')">Default</div>
    <div class="menu-item" onclick="setTheme('theme-light')">Light</div>
    <div class="menu-item" onclick="setTheme('theme-blue')">Blue</div>
    <div class="menu-item" onclick="setTheme('theme-green')">Green</div>
    <div class="menu-item" onclick="setTheme('theme-purple')">Purple</div>
  </div>
  <div>
    <strong>Language</strong>
    <select onchange="setLang(this.value)">
      <option>English</option>
      <option>Hindi</option>
      <option>Spanish</option>
      <option>French</option>
      <option>German</option>
      <option>Chinese</option>
      <option>Japanese</option>
      <option>Arabic</option>
      <option>Russian</option>
      <option>Portuguese</option>
    </select>
  </div>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="main">
<header>
  <div class="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <h3 style="margin-left:15px;">BotFusion AI</h3>
</header>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input type="file" id="fileInput" class="hidden">
  <button onclick="document.getElementById('fileInput').click()">+</button>
  <textarea id="msg" rows="1" placeholder="Message BotFusion..."></textarea>
  <button onclick="send()">Send</button>
</div>
</div>

<script>
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
const chat=document.getElementById("chat");

function toggleSidebar(){
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

function send(){
  const msg=document.getElementById("msg");
  if(!msg.value.trim())return;

  addMessage(msg.value,"user");
  setTimeout(()=>addMessage("This is a demo AI response.","bot"),800);
  msg.value="";
}

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function newChat(){
  chat.innerHTML="";
  toggleSidebar();
}

function showAccount(){
  alert("Google Login / Guest Mode UI Placeholder");
}

function showSettings(){
  alert("Settings Panel Placeholder");
}

function showReport(){
  alert("Report Modal Placeholder");
}

function setTheme(theme){
  document.body.className="";
  if(theme)document.body.classList.add(theme);
  localStorage.setItem("theme",theme);
}

function setLang(lang){
  alert("Language switched to "+lang);
}

window.onload=()=>{
  const saved=localStorage.getItem("theme");
  if(saved)setTheme(saved);
};
</script>

</body>
     </html>
