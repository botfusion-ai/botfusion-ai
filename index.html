<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotFusion AI</title>

<!-- Google Identity Services SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
  --bg:#1e1e1e;
  --panel:#2a2a2a;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#2f2f2f;
}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x: hidden;
  position: relative;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:14px;
  background:#111;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:280px;
  max-width:80vw;
  height:100vh;
  background:var(--panel);
  padding:20px;
  box-sizing:border-box;
  transform: translateX(-110%);
  transition: transform 0.3s ease;
  z-index:1001;
}

.sidebar.active{
  transform: translateX(0);
}

.sidebar h3{
  margin-top:0;
}

.sidebar button, .sidebar select{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3a3a3a;
  color:white;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.icon{
  font-size:42px;
  color:var(--accent);
}

.title{
  font-size:22px;
  margin:15px 0;
}

.cards{
  width:100%;
  max-width:420px;
}

.card{
  background:var(--card);
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  cursor:pointer;
}

/* CHAT INPUT */
.footer{
  padding:12px;
  background:#111;
  display:flex;
  align-items:center;
  gap:8px;
}

.footer input{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
}

.footer button{
  background:var(--accent);
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  color:black;
  font-size:18px;
}

/* THEMES */
.light{--bg:#f4f4f4;--panel:#ffffff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}
</style>
</head>

<body>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <button onclick="toggleMenu()" style="
    background:none;
    border:none;
    color:white;
    font-size:20px;
    margin-bottom:10px;
  ">✕ Close</button>

  <h3>BotFusion AI</h3>

  <div id="g_id_signin"></div>
  <p id="user-email" style="font-size:14px;margin-top:5px;"></p>

  <label>Language</label>
  <select id="lang-select">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
  </select>

  <label>Theme</label>
  <select onchange="setTheme(this.value)">
    <option value="">Default</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <label>Upload File</label>
  <input type="file" />

  <button onclick="alert('Report submitted')">Report</button>

  <p style="font-size:12px;opacity:.7">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="icon">⬢</div>
  <div class="title" id="main-title">How can I help you today?</div>

  <div class="cards" id="cards-container">
    <div class="card">Explain quantum computing in simple terms</div>
    <div class="card">Write a creative story about a robot</div>
    <div class="card">Help me debug my code</div>
    <div class="card">What's the best way to learn a new language?</div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <input placeholder="Message BotFusion..." id="chat-input"/>
  <button>↑</button>
</div>

<script>
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const userEmail = document.getElementById('user-email');

function toggleMenu(){
  sidebar.classList.toggle('active');
  overlay.classList.toggle('active');
}

function setTheme(theme){
  document.body.className = theme;
}

// GOOGLE LOGIN
function handleCredentialResponse(response) {
  const jwt = response.credential;
  // decode JWT if needed, here just displaying email placeholder
  userEmail.textContent = "Logged in!";
}

// Initialize Google sign-in
window.onload = function(){
  google.accounts.id.initialize({
    client_id: "YOUR_GOOGLE_CLIENT_ID",
    callback: handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.getElementById("g_id_signin"),
    { theme: "outline", size: "large" }
  );

  google.accounts.id.prompt(); // show One Tap prompt
}

// LANGUAGE CHANGE
const langSelect = document.getElementById('lang-select');
langSelect.addEventListener('change', function(){
  const lang = this.value;
  document.getElementById('main-title').textContent = {
    en: "How can I help you today?",
    hi: "मैं आज आपकी कैसे मदद कर सकता हूँ?",
    es: "¿Cómo puedo ayudarte hoy?",
    fr: "Comment puis-je vous aider aujourd'hui?",
    de: "Wie kann ich Ihnen heute helfen?"
  }[lang] || "How can I help you today?";
});
</script>

</body>
</html>
