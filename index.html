<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotFusion AI</title>
<style>
:root{
  --bg:#1e1e1e;
  --panel:#2a2a2a;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#2f2f2f;
}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:14px;
  background:#111;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:var(--panel);
  padding:20px;
  transition:.3s;
  z-index:1000;
  overflow-y:auto;
}

.sidebar.active{
  left:0;
}

.sidebar .close-btn{
  display:block;
  text-align:right;
  font-size:20px;
  cursor:pointer;
  margin-bottom:10px;
}

.sidebar h3{
  margin-top:0;
}

.sidebar button, .sidebar select, .sidebar input[type="file"]{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3a3a3a;
  color:white;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.icon{
  font-size:42px;
  color:var(--accent);
}

.title{
  font-size:22px;
  margin:15px 0;
}

.cards{
  width:100%;
  max-width:420px;
}

.card{
  background:var(--card);
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  cursor:pointer;
}

/* CHAT INPUT */
.footer{
  padding:12px;
  background:#111;
  display:flex;
  align-items:center;
  gap:8px;
}

.footer input{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
}

.footer button{
  background:var(--accent);
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  color:black;
  font-size:18px;
  cursor:pointer;
}

/* THEMES */
.light{--bg:#f4f4f4;--panel:#ffffff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}
</style>

<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <span class="close-btn" onclick="toggleMenu()">×</span>
  <h3>BotFusion AI</h3>

  <div id="g_id_onload"
       data-client_id="YOUR_GOOGLE_CLIENT_ID"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <label>Theme</label>
  <select onchange="setTheme(this.value)">
    <option value="">Default</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <label>Language</label>
  <select id="languageSelect">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
  </select>

  <label>Upload File</label>
  <input type="file" id="fileUpload" />

  <button onclick="alert('Report submitted')">Report</button>

  <p style="font-size:12px;opacity:.7">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="icon">⬢</div>
  <div class="title">How can I help you today?</div>

  <div class="cards">
    <div class="card">Explain quantum computing in simple terms</div>
    <div class="card">Write a creative story about a robot</div>
    <div class="card">Help me debug my code</div>
    <div class="card">What's the best way to learn a new language?</div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <input id="chatInput" placeholder="Message BotFusion..." />
  <button onclick="sendFile()">📎</button>
</div>

<script>
// Sidebar toggle
function toggleMenu(){
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('active');
}

// Theme switch
function setTheme(theme){
  document.body.className = theme;
}

// Language change
document.getElementById('languageSelect').addEventListener('change', e=>{
  alert('Language switched to '+e.target.value);
});

// File upload
function sendFile(){
  const fileInput = document.getElementById('fileUpload');
  if(fileInput.files.length>0){
    alert('File selected: '+fileInput.files[0].name);
  }else{
    alert('No file selected!');
  }
}

// Google login callback
function handleCredentialResponse(response){
  console.log('Encoded JWT ID token: ' + response.credential);
  alert('Google login successful!');
}
</script>
</body>
</html>
