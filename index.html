<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotFusion AI</title>

<style>
:root{
  --bg:#0f0f0f;
  --panel:#1c1c1c;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#2a2a2a;
}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:14px;
  background:#111;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-280px;
  width:280px;
  height:100%;
  background:var(--panel);
  padding:20px;
  transition:0.3s ease;
  z-index:1000;
}

.sidebar.active{
  left:0;
}

.close-btn{
  font-size:20px;
  cursor:pointer;
  float:right;
}

.sidebar h3{
  margin-top:10px;
}

.sidebar button,
.sidebar select{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3a3a3a;
  color:white;
  cursor:pointer;
}

/* MAIN */
.main{
  height:calc(100vh - 120px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.icon{
  font-size:42px;
  color:var(--accent);
}

.title{
  font-size:22px;
  margin:15px 0;
}

.cards{
  width:100%;
  max-width:420px;
}

.card{
  background:var(--card);
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
}

/* FOOTER */
.footer{
  height:60px;
  background:#111;
  display:flex;
  align-items:center;
  padding:10px;
  gap:8px;
}

.attach-btn{
  font-size:20px;
  cursor:pointer;
  background:#2a2a2a;
  padding:10px;
  border-radius:50%;
}

.footer input{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
}

.footer button{
  background:var(--accent);
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:18px;
  cursor:pointer;
}

/* THEMES */
.light{--bg:#f4f4f4;--panel:#ffffff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="close-btn" onclick="toggleMenu()">✕</div>
  <h3>BotFusion AI</h3>

  <button onclick="googleLogin()">Google Login</button>

  <label>Theme</label>
  <select onchange="setTheme(this.value)">
    <option value="">Dark (Default)</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <label>Language</label>
  <select onchange="changeLang(this.value)">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="mr">Marathi</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
    <option value="zh">Chinese</option>
    <option value="ar">Arabic</option>
  </select>

  <button onclick="alert('Report submitted')">Report Issue</button>

  <p style="font-size:12px;opacity:.7">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="icon">⬢</div>
  <div class="title">How can I help you today?</div>

  <div class="cards">
    <div class="card">Explain quantum computing in simple terms</div>
    <div class="card">Write a creative story about a robot</div>
    <div class="card">Help me debug my code</div>
    <div class="card">Best way to learn a new language?</div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <label class="attach-btn">
    📎
    <input type="file" hidden onchange="fileSelected(this)">
  </label>

  <input placeholder="Message BotFusion...">

  <button>↑</button>
</div>

<script>
function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('active');
}

function setTheme(theme){
  document.body.className = theme;
}

function changeLang(lang){
  alert("Language set to: " + lang);
}

/* GOOGLE LOGIN */
function googleLogin(){
  window.location.href = "http://localhost:5000/api/auth/google";
}

/* FILE UPLOAD */
function fileSelected(input){
  if(input.files.length > 0){
    alert("Selected: " + input.files[0].names);
  }
}
</script>

</body>
</html>
