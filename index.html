<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Workspace</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
display:flex;
height:100vh;
background:#111;
color:white;
overflow:hidden;
}

/* THEMES */

.theme-dark{background:#111;color:white}
.theme-light{background:#f4f4f4;color:black}
.theme-blue{background:#0f172a}
.theme-green{background:#022c22}
.theme-purple{background:#240046}

/* SIDEBAR */

.sidebar{
width:270px;
background:rgba(25,25,25,.9);
padding:12px;
display:flex;
flex-direction:column;
border-right:1px solid rgba(255,255,255,.1);
}

.sidebar h2{
margin-bottom:10px;
}

.search{
padding:8px;
border:none;
border-radius:6px;
margin-bottom:10px;
}

.history{
flex:1;
overflow:auto;
}

.chat-item{
padding:8px;
border-radius:6px;
display:flex;
justify-content:space-between;
cursor:pointer;
}

.chat-item:hover{
background:#333;
}

.pinned{color:gold}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
padding:10px;
background:#1a1a1a;
}

/* BUTTON */

.btn{
background:#333;
border:none;
padding:8px;
cursor:pointer;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
}

.btn:hover{
background:#555;
}

/* ICON */

.icon{
width:18px;
height:18px;
stroke:white;
fill:none;
stroke-width:2;
}

/* TABS */

.tabs{
display:flex;
gap:6px;
padding:6px;
background:#1b1b1b;
}

/* WORKSPACE */

.workspace{
flex:1;
overflow:auto;
padding:20px;
display:none;
}

.workspace.active{
display:block;
}

/* CHAT */

.chat{
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:12px 16px;
border-radius:12px;
max-width:70%;
}

.user{
background:#2f6fff;
margin-left:auto;
}

.ai{
background:#2a2a2a;
}

/* INPUT */

.input-bar{
display:flex;
padding:10px;
gap:6px;
background:#222;
}

.input-bar input{
flex:1;
padding:10px;
border:none;
border-radius:6px;
}

/* FILE PREVIEW */

.preview{
display:flex;
gap:10px;
margin-top:10px;
flex-wrap:wrap;
}

.preview img{
width:80px;
border-radius:6px;
}

/* CODE */

.code{
background:black;
padding:10px;
border-radius:6px;
font-family:monospace;
position:relative;
}

.copy{
position:absolute;
top:4px;
right:4px;
background:#444;
border:none;
color:white;
cursor:pointer;
padding:2px 6px;
}

/* TYPING */

.typing{
display:flex;
gap:4px;
}

.typing span{
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:blink 1s infinite;
}

.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

@keyframes blink{
0%,100%{opacity:.2}
50%{opacity:1}
}

/* PANEL */

.panel{
position:fixed;
right:-320px;
top:0;
width:320px;
height:100%;
background:#1e1e1e;
padding:20px;
transition:.3s;
overflow:auto;
}

.panel.active{right:0}

/* MOBILE */

@media(max-width:800px){

.sidebar{
position:absolute;
left:-270px;
height:100%;
z-index:5;
transition:.3s;
}

.sidebar.active{left:0}

}

</style>
</head>

<body class="theme-dark">

<!-- SVG ICON SYSTEM -->

<svg style="display:none">

<symbol id="menu" viewBox="0 0 24 24">
<line x1="3" y1="6" x2="21" y2="6"/>
<line x1="3" y1="12" x2="21" y2="12"/>
<line x1="3" y1="18" x2="21" y2="18"/>
</symbol>

<symbol id="send" viewBox="0 0 24 24">
<line x1="22" y1="2" x2="11" y2="13"/>
<polygon points="22 2 15 22 11 13 2 9 22 2"/>
</symbol>

<symbol id="mic" viewBox="0 0 24 24">
<rect x="9" y="2" width="6" height="12"/>
<path d="M5 10a7 7 0 0 0 14 0"/>
</symbol>

</svg>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

<h2>AI Workspace</h2>

<input class="search" id="search" placeholder="Search chats">

<button class="btn" onclick="newChat()">New Chat</button>

<div class="history" id="history"></div>

<button class="btn" onclick="toggleSettings()">Settings</button>

</div>

<!-- MAIN -->

<div class="main">

<div class="header">

<button class="btn" onclick="toggleSidebar()">
<svg class="icon"><use href="#menu"/></svg>
</button>

<select>
<option>Auto</option>
<option>GPT-4</option>
<option>Code</option>
<option>Vision</option>
</select>

<button class="btn" onclick="voice()">
<svg class="icon"><use href="#mic"/></svg>
</button>

</div>

<div class="tabs">

<button class="btn" onclick="tab('chat')">Chat</button>
<button class="btn" onclick="tab('image')">Image</button>
<button class="btn" onclick="tab('code')">Code</button>
<button class="btn" onclick="tab('data')">Data</button>
<button class="btn" onclick="tab('web')">Web</button>

</div>

<!-- CHAT -->

<div class="workspace active" id="chat">

<div class="chat" id="chatBox"></div>

<div class="preview" id="preview"></div>

</div>

<!-- IMAGE -->

<div class="workspace" id="image">
<h3>Image Generator</h3>
<input placeholder="Describe image...">
</div>

<!-- CODE -->

<div class="workspace" id="code">
<div class="code">
console.log("AI code assistant")
<button class="copy" onclick="copyCode(this)">copy</button>
</div>
</div>

<!-- DATA -->

<div class="workspace" id="data">

<canvas id="chart"></canvas>

</div>

<!-- WEB -->

<div class="workspace" id="web">

<input placeholder="Search the web">

</div>

<!-- INPUT -->

<div class="input-bar">

<input id="msg" placeholder="Ask anything">

<button class="btn" onclick="sendMsg()">
<svg class="icon"><use href="#send"/></svg>
</button>

<input type="file" id="fileInput" hidden>

<button class="btn" onclick="document.getElementById('fileInput').click()">
📁
</button>

</div>

</div>

<!-- SETTINGS -->

<div class="panel" id="settingsPanel">

<h3>Theme</h3>

<select onchange="setTheme(this.value)">
<option value="theme-dark">Dark</option>
<option value="theme-light">Light</option>
<option value="theme-blue">Blue</option>
<option value="theme-green">Green</option>
<option value="theme-purple">Purple</option>
</select>

<h3>Memory</h3>

<label>
<input type="checkbox" id="memory"> Enable memory
</label>

<h3>Language</h3>

<select id="lang"></select>

<button onclick="exportChat()">Export Chat</button>

</div>

<script>

/* SIDEBAR */

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("active")
}

/* PANELS */

function toggleSettings(){
document.getElementById("settingsPanel").classList.toggle("active")
}

/* TABS */

function tab(id){

document.querySelectorAll(".workspace")
.forEach(e=>e.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

/* CHAT */

function sendMsg(){

let input=document.getElementById("msg")
if(!input.value)return

addMsg("user",input.value)

typing()

saveChat()

input.value=""

}

function addMsg(role,text){

let div=document.createElement("div")
div.className="msg "+role
div.innerText=text

document.getElementById("chatBox").appendChild(div)

}

/* AI TYPING */

function typing(){

let chat=document.getElementById("chatBox")

let t=document.createElement("div")
t.className="msg ai typing"
t.innerHTML="<span></span><span></span><span></span>"

chat.appendChild(t)

setTimeout(()=>{

t.className="msg ai"
t.innerText="AI response example"

saveChat()

},1500)

}

/* SAVE CHAT */

function saveChat(){

localStorage.setItem(
"chat",
document.getElementById("chatBox").innerHTML
)

}

window.onload=function(){

let saved=localStorage.getItem("chat")

if(saved)document.getElementById("chatBox").innerHTML=saved

}

/* FILE PREVIEW */

document.getElementById("fileInput")
.addEventListener("change",e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let img=document.createElement("img")
img.src=reader.result

document.getElementById("preview").appendChild(img)

}

reader.readAsDataURL(file)

})

/* COPY */

function copyCode(btn){

navigator.clipboard.writeText(
btn.parentElement.innerText
)

}

/* VOICE */

function voice(){
alert("Voice UI ready")
}

/* THEME */

function setTheme(t){
document.body.className=t
localStorage.setItem("theme",t)
}

document.body.className=
localStorage.getItem("theme")||"theme-dark"

/* LANGUAGES */

let langs=[
"English","Spanish","French","German","Hindi","Arabic","Chinese","Japanese","Russian","Portuguese",
"Italian","Dutch","Greek","Turkish","Thai","Vietnamese","Indonesian","Malay","Polish","Swedish",
"Danish","Finnish","Norwegian","Czech","Slovak","Hungarian","Romanian","Bulgarian","Ukrainian",
"Serbian","Croatian","Slovenian","Estonian","Latvian","Lithuanian","Icelandic","Irish","Welsh"
]

let sel=document.getElementById("lang")

langs.forEach(l=>{
let o=document.createElement("option")
o.text=l
sel.appendChild(o)
})

/* EXPORT */

function exportChat(){

let text=document.getElementById("chatBox").innerText

let blob=new Blob([text])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)
a.download="chat.txt"
a.click()

}

/* CHART */

new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:["Jan","Feb","Mar","Apr","May"],
datasets:[{
label:"Data",
data:[2,6,4,7,5]
}]
}
})

</script>

</body>
  </html>
