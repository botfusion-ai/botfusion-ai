<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ==========================
   BASE STYLES
========================== */

:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #ffffff;
  --accent: #6366f1;
}

body {
  margin:0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* ==========================
   TOP NAV
========================== */

.topbar {
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  position:fixed;
  width:100%;
  top:0;
  z-index:1000;
}

.logo {
  font-weight:600;
  font-size:18px;
}

.icon-btn {
  cursor:pointer;
  font-size:20px;
}

/* ==========================
   SIDEBAR
========================== */

.sidebar {
  position:fixed;
  top:0;
  left:-280px;
  width:260px;
  height:100%;
  background:var(--card);
  transition:0.3s;
  padding:20px;
  z-index:1100;
}

.sidebar.active {
  left:0;
}

.sidebar h3 {
  margin-top:30px;
  font-size:14px;
  opacity:0.6;
}

.sidebar button {
  width:100%;
  padding:10px;
  margin-top:10px;
  background:none;
  border:none;
  color:var(--text);
  text-align:left;
  cursor:pointer;
}

.close-btn {
  text-align:right;
  font-size:20px;
  cursor:pointer;
}

.overlay {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:1050;
}

.overlay.active {
  display:block;
}

/* ==========================
   CHAT AREA
========================== */

.chat-container {
  max-width:850px;
  margin:100px auto 120px;
  padding:20px;
}

.message {
  margin-bottom:15px;
  padding:12px 16px;
  border-radius:12px;
  max-width:75%;
}

.user {
  background:var(--accent);
  margin-left:auto;
}

.bot {
  background:var(--card);
}

/* ==========================
   CHATBAR
========================== */

.chatbar {
  position:fixed;
  bottom:0;
  width:100%;
  background:var(--card);
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}

.chatbar input {
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

.chatbar button {
  background:var(--accent);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  color:white;
}

/* ==========================
   THEMES
========================== */

.theme-light {
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#111827;
  --accent:#4f46e5;
}

.theme-neon {
  --bg:#000000;
  --card:#111111;
  --text:#39ff14;
  --accent:#ff00ff;
}

.theme-ocean {
  --bg:#0f2027;
  --card:#203a43;
  --text:#ffffff;
  --accent:#2c5364;
}

.theme-rose {
  --bg:#1f1c2c;
  --card:#928dab;
  --text:#ffffff;
  --accent:#ff758c;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="close-btn" onclick="toggleSidebar()">✖</div>

  <h3>Chat</h3>
  <button onclick="newChat()">New Chat</button>

  <h3>Preferences</h3>
  <button onclick="setTheme('')">Dark</button>
  <button onclick="setTheme('theme-light')">Light</button>
  <button onclick="setTheme('theme-neon')">Neon</button>
  <button onclick="setTheme('theme-ocean')">Ocean</button>
  <button onclick="setTheme('theme-rose')">Rose</button>

  <h3>Account</h3>
  <button onclick="googleLogin()">Login with Google</button>
  <button onclick="guestMode()">Continue as Guest</button>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="icon-btn" onclick="toggleSidebar()">☰</div>
  <div class="logo">BotFusion AI</div>
  <div>👤</div>
</div>

<!-- CHAT -->
<div class="chat-container" id="chat"></div>

<!-- CHATBAR -->
<div class="chatbar">
  <input type="file" id="fileUpload" hidden>
  <button onclick="document.getElementById('fileUpload').click()">📎</button>

  <button onclick="startVoice()">🎤</button>

  <input type="text" id="messageInput" placeholder="Type your message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>

/* ==========================
   SIDEBAR CONTROL
========================== */

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('overlay').classList.toggle('active');
}

document.addEventListener('keydown', e=>{
  if(e.key === "Escape"){
    document.getElementById('sidebar').classList.remove('active');
    document.getElementById('overlay').classList.remove('active');
  }
});

/* ==========================
   CHAT FUNCTION
========================== */

function sendMessage(){
  let input = document.getElementById('messageInput');
  if(!input.value) return;

  addMessage(input.value, "user");
  setTimeout(()=>{
    addMessage("This is AI response (Connect your API).","bot");
  },500);

  input.value="";
}

function addMessage(text, type){
  let div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

function newChat(){
  document.getElementById("chat").innerHTML="";
}

/* ==========================
   THEMES
========================== */

function setTheme(theme){
  document.body.className="";
  if(theme) document.body.classList.add(theme);
}

/* ==========================
   VOICE INPUT
========================== */

function startVoice(){
  if(!('webkitSpeechRecognition' in window)){
    alert("Voice not supported in this browser.");
    return;
  }

  let recognition = new webkitSpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();
  recognition.onresult = function(event){
    document.getElementById('messageInput').value = event.results[0][0].transcript;
  };
}

/* ==========================
   AUTH (Firebase Required)
========================== */

function googleLogin(){
  alert("Connect Firebase for Google Login.");
}

function guestMode(){
  alert("Continuing as Guest.");
}

/* ==========================
   LANGUAGE READY (100+)
========================== */

const languages = {
  en:"English",
  hi:"Hindi",
  fr:"French",
  de:"German",
  es:"Spanish",
  zh:"Chinese",
  ar:"Arabic"
  // Add more up to 100+
};

</script>

</body>
  </html>
