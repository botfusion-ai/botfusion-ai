<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BOTFUSION AI</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js"></script>

<style>
:root{
  --bg:#101518;
  --panel:#161c22;
  --accent:#00c896;
  --text:#ffffff;
  --muted:#9aa4af;
}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
}
.sidebar{
  width:260px;
  background:var(--panel);
  height:100vh;
  position:fixed;
  left:-260px;
  transition:.3s;
  overflow:auto;
  padding:15px;
}
.sidebar.open{ left:0; }
.main{
  flex:1;
  margin-left:0;
  display:flex;
  flex-direction:column;
  height:100vh;
}
.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px 15px;
  background:var(--panel);
}
.icon{
  width:22px;
  height:22px;
  cursor:pointer;
  fill:var(--text);
}
.chat{
  flex:1;
  overflow:auto;
  padding:20px;
}
.input-area{
  display:flex;
  padding:10px;
  background:var(--panel);
}
input{
  flex:1;
  padding:10px;
  background:#1f252b;
  border:none;
  color:white;
}
button{
  background:none;
  border:none;
  cursor:pointer;
}
.panel{
  position:fixed;
  right:-400px;
  top:0;
  width:350px;
  height:100vh;
  background:var(--panel);
  transition:.3s;
  padding:20px;
  overflow:auto;
}
.panel.open{ right:0; }
.close-btn{
  float:right;
}
select{
  width:100%;
  padding:8px;
  background:#1f252b;
  color:white;
  border:none;
}
.theme-btn{
  display:block;
  margin:5px 0;
  padding:8px;
  background:#1f252b;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>Chats</h3>
  <button onclick="newChat()">New Chat</button>
  <div id="chatHistory"></div>
</div>

<!-- SETTINGS PANEL -->
<div class="panel" id="settingsPanel">
  <button class="close-btn" onclick="closePanel('settingsPanel')">
    <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <h3>Settings</h3>

  <h4>Theme</h4>
  <div class="theme-btn" onclick="setTheme('#101518')">Dark</div>
  <div class="theme-btn" onclick="setTheme('#ffffff','#000')">Light</div>
  <div class="theme-btn" onclick="setTheme('#0f2027')">Blue</div>
  <div class="theme-btn" onclick="setTheme('#1a1a2e')">Purple</div>
  <div class="theme-btn" onclick="setTheme('#002b36')">Teal</div>

  <h4>Language (100+)</h4>
  <select id="languageSelect"></select>

  <h4>Report</h4>
  <button onclick="reportIssue()">Report Issue</button>
</div>

<!-- ACCOUNT PANEL -->
<div class="panel" id="accountPanel">
  <button class="close-btn" onclick="closePanel('accountPanel')">
    <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <h3>Account</h3>
  <button onclick="googleLogin()">Login with Google</button>
  <button onclick="guestLogin()">Continue as Guest</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <button onclick="toggleSidebar()">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <h3>BOTFUSION AI</h3>
    <div>
      <button onclick="openPanel('settingsPanel')">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
      </button>
      <button onclick="openPanel('accountPanel')">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M12 12a5 5 0 100-10 5 5 0 000 10zM4 22a8 8 0 0116 0"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="chat" id="chatBox"></div>

  <div class="input-area">
    <input type="file" id="fileInput" hidden>
    <button onclick="document.getElementById('fileInput').click()">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      </svg>
    </button>

    <input id="userInput" placeholder="Type your message...">

    <button onclick="startVoice()">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 1a3 3 0 013 3v8a3 3 0 01-6 0V4a3 3 0 013-3z"/>
      </svg>
    </button>

    <button onclick="sendMessage()">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M2 12l19-9-5 9 5 9-19-9z"/>
      </svg>
    </button>
  </div>
</div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDA62eN5MEjX9Z-gw6w9UuR8L-Ke_6J7eE",
  authDomain: "botfusion-ai-bd6d0.firebaseapp.com",
  projectId: "botfusion-ai-bd6d0",
  storageBucket: "botfusion-ai-bd6d0.firebasestorage.app",
  messagingSenderId: "730477136598",
  appId: "1:730477136598:web:c6b4e0d495744d12079777",
  measurementId: "G-53FTWNQB8X"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// UI Functions
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}
function openPanel(id){
  document.getElementById(id).classList.add("open");
}
function closePanel(id){
  document.getElementById(id).classList.remove("open");
}
function setTheme(bg,color){
  document.documentElement.style.setProperty('--bg', bg);
  if(color) document.documentElement.style.setProperty('--text', color);
}
function newChat(){
  const div=document.createElement("div");
  div.textContent="Chat "+(document.getElementById("chatHistory").children.length+1);
  div.onclick=()=>div.contentEditable=true;
  document.getElementById("chatHistory").appendChild(div);
}
function sendMessage(){
  const input=document.getElementById("userInput");
  const msg=input.value;
  if(!msg) return;
  const p=document.createElement("p");
  p.textContent="You: "+msg;
  document.getElementById("chatBox").appendChild(p);
  speak(msg);
  input.value="";
}
function speak(text){
  const utter=new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utter);
}
function startVoice(){
  const rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.onresult=e=>{
    document.getElementById("userInput").value=e.results[0][0].transcript;
  };
  rec.start();
}

// Auth
function googleLogin(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}
function guestLogin(){
  auth.signInAnonymously();
}
function logout(){
  auth.signOut();
}

// Languages 100+
const languages=["English","Spanish","French","German","Hindi","Arabic","Chinese","Japanese","Korean","Russian","Portuguese","Italian","Dutch","Turkish","Bengali","Urdu","Tamil","Telugu","Malayalam","Thai","Vietnamese","Polish","Greek","Swedish","Norwegian","Finnish","Danish","Czech","Hungarian","Romanian","Slovak","Ukrainian","Hebrew","Persian","Indonesian","Malay","Filipino","Swahili","Zulu","Afrikaans"];
while(languages.length<110){ languages.push("Language "+languages.length); }
const select=document.getElementById("languageSelect");
languages.forEach(lang=>{
  const opt=document.createElement("option");
  opt.textContent=lang;
  select.appendChild(opt);
});

function reportIssue(){
  alert("Report submitted successfully.");
}
</script>
</body>
  </html>
