<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<style>
:root {
--bg:#0f0f0f;
--sidebar:#161616;
--text:#ffffff;
--accent:#10a37f;
--card:#1e1e1e;
}

body.light {
--bg:#f5f5f5;
--sidebar:#ffffff;
--text:#000;
--accent:#007aff;
--card:#eaeaea;
}

body.purple {
--bg:#140f1f;
--sidebar:#1d142c;
--text:#ffffff;
--accent:#9b5cff;
--card:#221832;
}

body.blue {
--bg:#0d1b2a;
--sidebar:#13293d;
--text:#ffffff;
--accent:#00b4ff;
--card:#1b3358;
}

body.gold {
--bg:#1a1400;
--sidebar:#261c00;
--text:#fff;
--accent:#ffc300;
--card:#2d2200;
}

* {margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}
body {background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;}

#overlay {
position:fixed;inset:0;background:rgba(0,0,0,0.5);
opacity:0;pointer-events:none;transition:.3s;
}

#overlay.active {opacity:1;pointer-events:auto;}

#sidebar {
position:fixed;left:-300px;top:0;width:280px;height:100%;
background:var(--sidebar);padding:20px;transition:.4s;
display:flex;flex-direction:column;z-index:1000;
}

#sidebar.active {left:0;}

.hamburger {
position:absolute;top:20px;left:20px;
cursor:pointer;width:30px;height:22px;
display:flex;flex-direction:column;justify-content:space-between;
}

.hamburger span {
height:4px;background:var(--text);border-radius:4px;
transition:.4s;
}

#main {
flex:1;display:flex;flex-direction:column;margin-left:0;
}

.header {
padding:20px;text-align:center;font-size:22px;font-weight:600;
}

#chatArea {
flex:1;padding:20px;overflow-y:auto;
}

.message {
background:var(--card);padding:12px;border-radius:12px;
margin-bottom:10px;animation:fadeIn .3s ease;
}

@keyframes fadeIn {
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.chatbar {
display:flex;padding:15px;background:var(--sidebar);
gap:10px;
}

.chatbar input {
flex:1;padding:12px;border:none;border-radius:10px;
background:var(--card);color:var(--text);
}

.icon-btn {
width:40px;height:40px;border-radius:10px;
background:var(--card);display:flex;
align-items:center;justify-content:center;
cursor:pointer;transition:.3s;
}

.icon-btn:hover {transform:scale(1.1);}

select,button {
background:var(--card);color:var(--text);
border:none;padding:8px;border-radius:8px;
margin-bottom:10px;
}

.modal {
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%) scale(0);
background:var(--sidebar);padding:20px;
border-radius:15px;z-index:2000;
transition:.3s;width:300px;
}

.modal.active {transform:translate(-50%,-50%) scale(1);}

</style>
</head>
<body>

<div id="overlay"></div>

<div id="sidebar">
<h3>BotFusion AI</h3>
<button onclick="newChat()">+ New Chat</button>
<div id="chatList"></div>

<hr>

<button onclick="openSettings()">Settings</button>
<button onclick="openAccount()">Account</button>
<button onclick="openReport()">Report</button>
<button onclick="logout()">Logout</button>
</div>

<div id="main">
<div class="hamburger" onclick="toggleSidebar()">
<span></span><span></span><span></span>
</div>

<div class="header">BotFusion AI</div>

<div id="chatArea"></div>

<div class="chatbar">
<div class="icon-btn" onclick="uploadFile()">
<svg width="20" height="20" fill="var(--accent)">
<path d="M10 0v12M5 5l5-5 5 5"/>
</svg>
</div>

<input id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendMessage()">

<div class="icon-btn" onclick="voiceInput()">
<svg width="20" height="20" fill="var(--accent)">
<circle cx="10" cy="6" r="4"/>
<rect x="8" y="10" width="4" height="6"/>
</svg>
</div>

<div class="icon-btn" onclick="sendMessage()">
<svg width="20" height="20" fill="var(--accent)">
<polygon points="0,10 20,0 15,20"/>
</svg>
</div>

</div>
</div>

<div id="settingsModal" class="modal">
<h3>Settings</h3>
<label>Theme</label>
<select onchange="changeTheme(this.value)">
<option value="">Default</option>
<option value="light">Light</option>
<option value="purple">Purple</option>
<option value="blue">Blue</option>
<option value="gold">Gold</option>
</select>

<label>Language</label>
<select>
<option>English</option>
<option>Hindi</option>
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Chinese</option>
<option>Arabic</option>
<option>Russian</option>
<option>Japanese</option>
<option>Portuguese</option>
</select>

<button onclick="closeModal()">Close</button>
</div>

<div id="accountModal" class="modal">
<h3>Account</h3>
<button onclick="googleLogin()">Login with Google</button>
<button onclick="guestMode()">Continue as Guest</button>
<button onclick="closeModal()">Close</button>
</div>

<div id="reportModal" class="modal">
<h3>Report Issue</h3>
<textarea placeholder="Describe issue..." style="width:100%;height:80px;background:var(--card);color:var(--text);border:none;border-radius:8px;"></textarea>
<button onclick="closeModal()">Submit</button>
</div>

<script>
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function googleLogin(){
const provider = new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}

function logout(){auth.signOut();}

function guestMode(){alert("Guest Mode Activated");}

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("active");
document.getElementById("overlay").classList.toggle("active");
}

document.getElementById("overlay").onclick=toggleSidebar;

function sendMessage(){
const input=document.getElementById("chatInput");
if(!input.value) return;
const msg=document.createElement("div");
msg.className="message";
msg.innerText=input.value;
document.getElementById("chatArea").appendChild(msg);
input.value="";
}

function changeTheme(theme){
document.body.className=theme;
}

function openSettings(){
document.getElementById("settingsModal").classList.add("active");
}

function openAccount(){
document.getElementById("accountModal").classList.add("active");
}

function openReport(){
document.getElementById("reportModal").classList.add("active");
}

function closeModal(){
document.querySelectorAll(".modal").forEach(m=>m.classList.remove("active"));
}

function uploadFile(){alert("Upload feature backend pending");}
function voiceInput(){alert("Voice feature backend pending");}
function newChat(){alert("New Chat Created");}

</script>

</body>
  </html>
