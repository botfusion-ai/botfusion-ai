<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotFusion</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 250px;
      background: #1f1f1f;
      color: white;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    #sidebar.hide {
      transform: translateX(-100%);
    }

    #sidebar .toggle-btn {
      cursor: pointer;
      padding: 10px;
      background: #111;
      text-align: center;
    }

    #sidebar .menu {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    #sidebar button, #sidebar a {
      display: block;
      width: 100%;
      padding: 8px 10px;
      margin: 5px 0;
      color: white;
      background: #333;
      border: none;
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      border-radius: 4px;
    }

    /* Main Chat Area */
    #main {
      flex: 1;
      background: #121212;
      display: flex;
      flex-direction: column;
      color: white;
    }

    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    #chat-area .message {
      background: #2c2c2c;
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 8px;
      max-width: 80%;
    }

    /* Chatbar */
    #chatbar {
      display: flex;
      padding: 10px;
      background: #1f1f1f;
      align-items: center;
    }

    #chatbar input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      margin-right: 8px;
      background: #333;
      color: white;
    }

    #chatbar button {
      padding: 8px 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: #00c853;
      color: white;
      font-size: 16px;
    }

    #chatbar label {
      cursor: pointer;
      margin-right: 8px;
      font-size: 20px;
      color: #00c853;
    }

    /* File input hidden */
    #file-upload {
      display: none;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        z-index: 1000;
        height: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar" class="hide">
    <div class="toggle-btn" id="toggle-btn">☰</div>

    <div class="menu">
      <!-- User Info -->
      <div id="user-info" style="margin-bottom:12px; font-size:14px; display:none;">
        <strong id="user-name"></strong><br/>
        <span id="user-email"></span>
      </div>

      <!-- Google Login Button -->
      <button id="google-login">Login with Google</button>

      <!-- Example Menu Items -->
      <button>Dashboard</button>
      <button>Settings</button>
      <button>Logout</button>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div id="main">
    <div id="chat-area">
      <div class="message">How can I help you today?</div>
    </div>

    <!-- Chatbar -->
    <div id="chatbar">
      <!-- File Upload -->
      <label for="file-upload">📎</label>
      <input type="file" id="file-upload" />

      <input type="text" id="chat-input" placeholder="Message BotFusion...">
      <button id="send-btn">↑</button>
    </div>
  </div>

  <script>
    // Toggle sidebar
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('hide');
    });

    // Google login & show user info
    const userInfoDiv = document.getElementById('user-info');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');

    async function checkUser() {
      try {
        const res = await fetch('http://localhost:5000/api/user', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          userName.textContent = data.name;
          userEmail.textContent = data.email;
          userInfoDiv.style.display = 'block';
          document.getElementById('google-login').style.display = 'none';
        } else {
          userInfoDiv.style.display = 'none';
          document.getElementById('google-login').style.display = 'block';
        }
      } catch (err) {
        console.log(err);
      }
    }

    checkUser();

    document.getElementById('google-login').addEventListener('click', function() {
      window.location.href = 'http://localhost:5001/api/auth/google';
    });

    // Chat send functionality
    const chatInput = document.getElementById('chat-input');
    const chatArea = document.getElementById('chat-area');
    const sendBtn = document.getElementById('send-btn');

    sendBtn.addEventListener('click', () => {
      const msg = chatInput.value.trim();
      if (!msg) return;
      const div = document.createElement('div');
      div.className = 'message';
      div.textContent = msg;
      chatArea.appendChild(div);
      chatInput.value = '';
      chatArea.scrollTop = chatArea.scrollHeight;
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // File upload
    const fileInput = document.getElementById('file-upload');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const div = document.createElement('div');
        div.className = 'message';
        div.textContent = `📎 ${file.name} uploaded`;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    });
  </script>
</body>
</html>
