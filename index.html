<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<style>
/* ================= THEME VARIABLES ================= */
:root{
  --bg:#0f0f0f;
  --panel:#1a1a1a;
  --card:#222;
  --text:#ffffff;
  --accent:#19c37d;
}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* ================= HEADER ================= */
.header{
  height:56px;
  display:flex;
  align-items:center;
  padding:0 16px;
  background:#000;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
}

.title{
  margin-left:14px;
  font-weight:600;
}

/* ================= SIDEBAR ================= */
.sidebar{
  position:fixed;
  top:0;
  left:-100%;
  width:280px;
  height:100%;
  background:var(--panel);
  padding:16px;
  transition:.3s;
  z-index:1000;
}

.sidebar.active{ left:0; }

.close-btn{
  font-size:20px;
  cursor:pointer;
  text-align:right;
}

.sidebar h3{
  margin:10px 0;
}

.sidebar button, select{
  width:100%;
  margin:8px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#2a2a2a;
  color:white;
  cursor:pointer;
}

/* ================= CHAT AREA ================= */
.chat{
  height:calc(100vh - 120px);
  padding:16px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.msg{
  max-width:75%;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.user{
  align-self:flex-end;
  background:var(--accent);
  color:#000;
}

.bot{
  align-self:flex-start;
  background:var(--card);
}

/* ================= CHAT BAR ================= */
.chatbar{
  height:64px;
  background:#000;
  display:flex;
  align-items:center;
  padding:8px;
  gap:8px;
}

.chatbar input[type="text"]{
  flex:1;
  padding:12px 14px;
  border-radius:24px;
  border:none;
  background:#222;
  color:white;
}

.chatbar button{
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  font-size:18px;
  cursor:pointer;
}

.file-input{
  display:none;
}

.file-label{
  font-size:20px;
  cursor:pointer;
  color:white;
}

/* ================= SETTINGS MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.modal.active{ display:flex; }

.modal-content{
  background:var(--panel);
  width:90%;
  max-width:400px;
  padding:16px;
  border-radius:12px;
}

.modal-content h3{
  margin-top:0;
}

/* ================= THEMES ================= */
.light{--bg:#f5f5f5;--panel:#fff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">
  <div class="close-btn" onclick="toggleSidebar()">✖</div>
  <h3>BotFusion</h3>

  <button onclick="newChat()">➕ New Chat</button>
  <button onclick="openSettings()">⚙ Settings</button>
  <button onclick="showHistory()">📜 History</button>
  <button onclick="googleLogin()">🔐 Google Login</button>
  <button onclick="alert('Report submitted')">🚩 Report</button>
  <button onclick="alert('Help coming soon')">❓ Help</button>
</div>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="menu-btn" onclick="toggleSidebar()">☰</div>
  <div class="title">BotFusion AI</div>
</div>

<!-- ================= CHAT ================= -->
<div class="chat" id="chat">
  <div class="bot msg">Hello 👋 How can I help you?</div>
</div>

<!-- ================= CHAT BAR ================= -->
<div class="chatbar">
  <label class="file-label" for="file">📎</label>
  <input type="file" id="file" class="file-input">
  <input type="text" id="input" placeholder="Message BotFusion..." oninput="startChat()">
  <button onclick="send()">➤</button>
</div>

<!-- ================= SETTINGS ================= -->
<div class="modal" id="settings">
  <div class="modal-content">
    <h3>Settings</h3>

    <label>Theme</label>
    <select onchange="setTheme(this.value)">
      <option value="">Default</option>
      <option value="light">Light</option>
      <option value="grey">Grey</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="black">Black</option>
    </select>

    <label>Language</label>
    <select>
      <option>English</option>
      <option>Hindi</option>
      <option>Marathi</option>
    </select>

    <h4>About BotFusion</h4>
    <p style="font-size:13px;opacity:.8">
      BotFusion is an AI assistant designed to help users learn, create and solve problems efficiently.
    </p>

    <button onclick="closeSettings()">Close</button>
  </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem("botfusion_chats")) || [];
let currentChat = [];

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('active');
}

function openSettings(){
  toggleSidebar();
  document.getElementById('settings').classList.add('active');
}

function closeSettings(){
  document.getElementById('settings').classList.remove('active');
}

function setTheme(t){
  document.body.className=t;
  localStorage.setItem("theme", t);
}

function startChat(){
  if(document.querySelectorAll('.msg').length===1){
    document.getElementById('chat').innerHTML='';
  }
}

function send(){
  const input = document.getElementById('input');
  if(!input.value) return;

  addMessage("user", input.value);

  // Fake bot reply for now
  setTimeout(()=>{
    addMessage("bot","BotFusion response will come from backend 🤖");
    saveChat();
  },500);

  input.value='';
}

function addMessage(role,text){
  const chat=document.getElementById('chat');
  chat.innerHTML+=`<div class="msg ${role}">${text}</div>`;
  chat.scrollTop=chat.scrollHeight;
  currentChat.push({role,text});
}

function saveChat(){
  if(currentChat.length>0){
    chats.push(currentChat);
    localStorage.setItem("botfusion_chats", JSON.stringify(chats));
  }
}

function newChat(){
  currentChat=[];
  document.getElementById('chat').innerHTML=
    '<div class="bot msg">New chat started 👋</div>';
  toggleSidebar();
}

function showHistory(){
  let list = chats.map((c,i)=>`Chat ${i+1}`).join("\n");
  alert("Saved Chats:\n"+list);
}

function googleLogin(){
  window.location.href="http://localhost:5001/auth/google";
}

/* Load saved theme */
document.body.className = localStorage.getItem("theme") || "";
</script>

</body>
</html>
