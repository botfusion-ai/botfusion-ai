<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<style>
:root{
  --bg:#1e1e1e;
  --panel:#2a2a2a;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#2f2f2f;
}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:14px;
  background:#111;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-280px;
  width:280px;
  height:100%;
  background:var(--panel);
  padding:20px;
  transition:.3s;
  z-index:1000;
}

.sidebar.active{ left:0; }

.sidebar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  font-size:22px;
  cursor:pointer;
}

.sidebar label{
  font-size:13px;
  opacity:.8;
}

.sidebar button,
.sidebar select,
.sidebar input{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3a3a3a;
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.45);
  display:none;
  z-index:900;
}

.overlay.active{ display:block; }

/* MAIN */
.main{
  flex:1;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.icon{
  width:36px;
  height:36px;
  background:var(--accent);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  margin-bottom:12px;
}

.title{
  font-size:22px;
  margin:10px 0 20px;
  text-align:center;
}

.cards{
  width:100%;
  max-width:420px;
}

.card{
  background:var(--card);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
}

/* FOOTER */
.footer{
  padding:12px;
  background:#111;
  display:flex;
  align-items:center;
  gap:8px;
}

.footer input{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
}

.footer button{
  background:var(--accent);
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:18px;
}

/* THEMES */
.light{--bg:#f4f4f4;--panel:#ffffff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>BotFusion AI</h3>
    <span class="close-btn" onclick="toggleMenu()">✕</span>
  </div>

  <button onclick="googleLogin()">Google Login</button>

  <label>Language</label>
  <select onchange="setLanguage(this.value)">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="mr">Marathi</option>
  </select>

  <label>Theme</label>
  <select onchange="setTheme(this.value)">
    <option value="">Default</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <label>Upload File</label>
  <input type="file">

  <button onclick="reportIssue()">Report</button>

  <p style="font-size:12px;opacity:.7">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="icon"></div>
  <div class="title" id="titleText">How can I help you today?</div>

  <div class="cards">
    <div class="card">Explain quantum computing in simple terms</div>
    <div class="card">Write a creative story about a robot</div>
    <div class="card">Help me debug my code</div>
    <div class="card">What's the best way to learn a new language?</div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <input placeholder="Message BotFusion...">
  <button>↑</button>
</div>

<script>
function toggleMenu(){
  sidebar.classList.toggle('active');
  overlay.classList.toggle('active');
}

function setTheme(theme){
  document.body.className = theme;
}

function setLanguage(lang){
  const title = document.getElementById('titleText');
  if(lang === 'hi') title.innerText = "मैं आपकी कैसे मदद कर सकता हूँ?";
  else if(lang === 'mr') title.innerText = "मी तुम्हाला कशी मदत करू शकतो?";
  else title.innerText = "How can I help you today?";
}

function googleLogin(){
  window.location.href = "http://localhost:5000/api/auth/google";
}

function reportIssue(){
  alert("Report submitted. Thank you!");
}
</script>

</body>
</html>
