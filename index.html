<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#101518;
--panel:#161c22;
--primary:#5b8cff;
--text:#ffffff;
--sub:#9aa4af;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

.header{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:var(--panel);
}

.icon-btn{
background:none;
border:none;
cursor:pointer;
color:var(--text);
display:flex;
align-items:center;
}

.icon-btn svg{
width:22px;
height:22px;
}

.sidebar{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:var(--panel);
transition:.3s;
padding:20px;
box-shadow:2px 0 10px rgba(0,0,0,.4);
z-index:10;
}

.sidebar.active{
left:0;
}

.sidebar-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
margin:15px 0;
cursor:pointer;
color:var(--sub);
}

.sidebar li:hover{
color:var(--primary);
}

.chat{
height:calc(100vh - 120px);
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
}

.message{
margin:8px 0;
padding:12px 16px;
border-radius:14px;
max-width:70%;
}

.user{
background:var(--primary);
align-self:flex-end;
}

.bot{
background:#1f252c;
}

.input-bar{
height:60px;
display:flex;
align-items:center;
padding:0 10px;
background:var(--panel);
gap:10px;
}

.input-bar input{
flex:1;
height:40px;
border:none;
outline:none;
background:#1f252c;
color:white;
border-radius:8px;
padding:0 10px;
}

select{
width:100%;
padding:8px;
background:#1f252c;
color:white;
border:none;
border-radius:6px;
margin-bottom:15px;
}

.theme-gold{--primary:#d4af37;}
.theme-purple{--primary:#9b5cff;}
.theme-teal{--primary:#00c2a8;}
.theme-rose{--primary:#ff4f81;}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
z-index:20;
}

.modal-content{
background:var(--panel);
padding:20px;
width:300px;
border-radius:12px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<button class="icon-btn" onclick="toggleSidebar()">☰</button>
<strong>BotFusion AI</strong>
<button class="icon-btn" onclick="openSettings()">⚙</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<div class="sidebar-header">
<strong>Menu</strong>
<button onclick="toggleSidebar()">✕</button>
</div>

<ul>
<li onclick="loginGoogle()">Google Login</li>
<li onclick="guestMode()">Guest Mode</li>
<li onclick="openSettings()">Settings</li>
<li onclick="openReport()">Report Issue</li>
</ul>
</div>

<!-- CHAT -->
<div class="chat" id="chat">
<div class="message bot">Welcome to BotFusion AI</div>
</div>

<!-- INPUT -->
<div class="input-bar">
<input type="file" id="fileUpload" hidden>
<button onclick="document.getElementById('fileUpload').click()">📎</button>
<input type="text" id="msg" placeholder="Ask anything...">
<button onclick="startVoice()">🎤</button>
<button onclick="sendMessage()">➤</button>
</div>

<!-- SETTINGS PANEL -->
<div class="sidebar" id="settings" style="right:-260px;left:auto;">
<div class="sidebar-header">
<strong>Settings</strong>
<button onclick="closeSettings()">✕</button>
</div>

<h4>Theme</h4>
<select onchange="changeTheme(this.value)">
<option value="">Default</option>
<option value="theme-gold">Gold</option>
<option value="theme-purple">Purple</option>
<option value="theme-teal">Teal</option>
<option value="theme-rose">Rose</option>
</select>

<h4>Language</h4>
<select id="languageSelect"></select>
</div>

<!-- REPORT MODAL -->
<div class="modal" id="reportModal">
<div class="modal-content">
<h3>Report Issue</h3>
<textarea style="width:100%;height:80px;"></textarea>
<button onclick="closeReport()">Close</button>
</div>
</div>

<script>

/* ---------- BASIC UI ---------- */
function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("active");
}

function openSettings(){
document.getElementById("settings").style.right="0";
}

function closeSettings(){
document.getElementById("settings").style.right="-260px";
}

function openReport(){
document.getElementById("reportModal").style.display="flex";
}

function closeReport(){
document.getElementById("reportModal").style.display="none";
}

/* ---------- CHAT ---------- */
function sendMessage(){
let input=document.getElementById("msg");
if(!input.value.trim()) return;

let chat=document.getElementById("chat");

let user=document.createElement("div");
user.className="message user";
user.innerText=input.value;

chat.appendChild(user);
chat.scrollTop=chat.scrollHeight;
input.value="";
}

/* ---------- THEMES ---------- */
function changeTheme(theme){
document.body.className=theme;
}

/* ---------- LANGUAGE 100+ ---------- */
let langs = Intl.supportedValuesOf("language");
let select = document.getElementById("languageSelect");
langs.forEach(lang=>{
let opt=document.createElement("option");
opt.value=lang;
opt.textContent=lang;
select.appendChild(opt);
});

/* ---------- VOICE ---------- */
function startVoice(){
let recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.lang="en-US";
recognition.start();
recognition.onresult=function(e){
document.getElementById("msg").value=e.results[0][0].transcript;
};
}

/* ---------- GUEST MODE ---------- */
function guestMode(){
sessionStorage.setItem("mode","guest");
alert("Guest Mode Activated");
}

/* ---------- GOOGLE LOGIN (Firebase Required) ---------- */
/* Replace config below with your Firebase project */

function loginGoogle(){
alert("Connect Firebase to enable Google Login");
}

</script>

</body>
 </html>
