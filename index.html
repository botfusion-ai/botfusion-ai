<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotFusion</title>

<style>
/* ---------- RESET ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* ---------- BODY ---------- */
body {
  background: #1e1e1e;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

/* ---------- HEADER ---------- */
header {
  height: 56px;
  background: #111;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 14px;
}

.menu-btn {
  font-size: 22px;
  cursor: pointer;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}

.logo {
  width: 22px;
  height: 22px;
  border: 2px solid #19c37d;
  transform: rotate(45deg);
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  position: fixed;
  top: 56px;
  left: -260px;
  width: 260px;
  height: calc(100vh - 56px);
  background: #121212;
  padding: 16px;
  transition: left 0.3s ease;
  z-index: 10;
}

.sidebar.open {
  left: 0;
}

.sidebar h3 {
  font-size: 14px;
  margin-bottom: 10px;
  color: #aaa;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  background: #1f1f1f;
  border: none;
  color: #fff;
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
}

.sidebar button:hover {
  background: #2a2a2a;
}

/* ---------- OVERLAY ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 5;
}

.overlay.show {
  display: block;
}

/* ---------- MAIN ---------- */
main {
  height: calc(100vh - 56px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* ---------- HERO ---------- */
.hero-logo {
  width: 50px;
  height: 50px;
  border: 3px solid #19c37d;
  margin-bottom: 16px;
  transform: rotate(45deg);
}

h1 {
  margin-bottom: 20px;
  font-size: 24px;
}

/* ---------- SUGGESTIONS ---------- */
.suggestion {
  width: 100%;
  max-width: 420px;
  background: #2a2a2a;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
  color: #ccc;
}

/* ---------- CHAT BAR ---------- */
.chat-bar {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  background: #2a2a2a;
  border-radius: 24px;
  display: flex;
  align-items: center;
  padding: 10px 12px;
  gap: 10px;
}

.chat-bar input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 15px;
}

.icon-btn {
  background: none;
  border: none;
  color: #aaa;
  font-size: 20px;
  cursor: pointer;
}

.send-btn {
  background: #19c37d;
  border: none;
  color: #000;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
}

/* ---------- GOOGLE LOGIN ---------- */
.google-btn {
  margin-top: 16px;
  background: #fff;
  color: #000;
  padding: 12px;
  width: 100%;
  max-width: 260px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleSidebar()">☰</div>
  <div class="brand">
    <div class="logo"></div>
    BotFusion
  </div>
</header>

<div class="sidebar" id="sidebar">
  <h3>MENU</h3>
  <button>New Chat</button>
  <button>History</button>
  <button>Settings</button>
  <button onclick="googleLogin()">Login with Google</button>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<main>
  <div class="hero-logo"></div>
  <h1>How can I help you today?</h1>

  <div class="suggestion">Explain quantum computing in simple terms</div>
  <div class="suggestion">Write a creative story about a robot</div>
  <div class="suggestion">Help me debug my code</div>
  <div class="suggestion">What's the best way to learn a new language?</div>

  <button class="google-btn" onclick="googleLogin()">Continue with Google</button>
</main>

<div class="chat-bar">
  <button class="icon-btn">📎</button>
  <input type="text" placeholder="Message BotFusion..." />
  <button class="send-btn">↑</button>
</div>

<script>
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

/* ✅ GOOGLE LOGIN – FINAL & CORRECT */
function googleLogin() {
  window.location.href = "http://localhost:5000/api/auth/google";
}
</script>

</body>
</html>
