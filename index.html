<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<style>
:root{
--bg:#101518;
--panel:#161c22;
--primary:#5b8cff;
--text:#ffffff;
--muted:#8b949e;
--border:#1f262c;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* HEADER */
.header{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
background:var(--panel);
border-bottom:1px solid var(--border);
font-weight:600;
}

.icon-btn{
background:none;
border:none;
color:var(--text);
cursor:pointer;
padding:6px;
border-radius:8px;
transition:.2s;
display:flex;
align-items:center;
justify-content:center;
}

.icon-btn:hover{
background:rgba(255,255,255,0.05);
}

.icon{
width:22px;
height:22px;
stroke:currentColor;
stroke-width:2;
fill:none;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:var(--panel);
transition:.3s;
padding:20px;
z-index:100;
border-right:1px solid var(--border);
}

.sidebar.active{
left:0;
}

.sidebar-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:12px 0;
cursor:pointer;
color:var(--muted);
}

.sidebar li:hover{
color:var(--primary);
}

/* CHAT */
.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
max-width:75%;
padding:12px 16px;
border-radius:16px;
font-size:14px;
line-height:1.5;
animation:fadeIn .2s ease;
}

.user{
align-self:flex-end;
background:var(--primary);
color:white;
}

.bot{
align-self:flex-start;
background:#1f252c;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(5px);}
to{opacity:1;transform:translateY(0);}
}

/* INPUT */
.input-bar{
height:60px;
display:flex;
align-items:center;
padding:0 10px;
gap:8px;
background:var(--panel);
border-top:1px solid var(--border);
}

.input-bar input{
flex:1;
height:40px;
border:none;
outline:none;
background:#1f252c;
color:white;
border-radius:10px;
padding:0 12px;
font-size:14px;
}

.user-info{
font-size:12px;
color:var(--muted);
}
</style>
</head>

<body>

<div class="header">

<button class="icon-btn" onclick="toggleSidebar()">
<svg class="icon" viewBox="0 0 24 24">
<line x1="3" y1="6" x2="21" y2="6"/>
<line x1="3" y1="12" x2="21" y2="12"/>
<line x1="3" y1="18" x2="21" y2="18"/>
</svg>
</button>

<div>BotFusion AI</div>

<div id="userDisplay" class="user-info">Guest</div>

</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<div class="sidebar-header">
<strong>Menu</strong>
<button class="icon-btn" onclick="toggleSidebar()">
<svg class="icon" viewBox="0 0 24 24">
<line x1="6" y1="6" x2="18" y2="18"/>
<line x1="18" y1="6" x2="6" y2="18"/>
</svg>
</button>
</div>

<ul>
<li onclick="googleLogin()">Google Login</li>
<li onclick="logout()">Logout</li>
</ul>
</div>

<!-- CHAT -->
<div class="chat" id="chat">
<div class="message bot">Welcome to BotFusion AI</div>
</div>

<!-- INPUT -->
<div class="input-bar">
<input type="text" id="msg" placeholder="Ask anything...">

<button class="icon-btn" onclick="sendMessage()">
<svg class="icon" viewBox="0 0 24 24">
<line x1="22" y1="2" x2="11" y2="13"/>
<polygon points="22 2 15 22 11 13 2 9 22 2"/>
</svg>
</button>
</div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA62eN5MEjX9Z-gw6w9UuR8L-Ke_6J7eE",
  authDomain: "botfusion-ai-bd6d0.firebaseapp.com",
  projectId: "botfusion-ai-bd6d0",
  storageBucket: "botfusion-ai-bd6d0.firebasestorage.app",
  messagingSenderId: "730477136598",
  appId: "1:730477136598:web:c6b4e0d495744d12079777",
  measurementId: "G-53FTWNQB8X"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.googleLogin = async function(){
  try{
    await signInWithPopup(auth, provider);
    toggleSidebar();
  }catch(e){
    alert("Login Failed");
  }
}

window.logout = async function(){
  await signOut(auth);
  toggleSidebar();
}

onAuthStateChanged(auth,(user)=>{
  const display = document.getElementById("userDisplay");
  if(user){
    display.innerText = user.displayName;
  } else {
    display.innerText = "Guest";
  }
});
</script>

<script>
function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("active");
}

function sendMessage(){
let input=document.getElementById("msg");
if(!input.value.trim()) return;

let chat=document.getElementById("chat");

let user=document.createElement("div");
user.className="message user";
user.innerText=input.value;

chat.appendChild(user);
input.value="";
chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
 </html>
