<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
:root{
--bg:#0f0f0f;
--sidebar:#171717;
--text:#ffffff;
--card:#1e1e1e;
--accent:#10a37f;
}

body.light{
--bg:#f5f5f5;
--sidebar:#ffffff;
--text:#000000;
--card:#eaeaea;
--accent:#007aff;
}

body.purple{
--bg:#140f1f;
--sidebar:#1d142c;
--text:#ffffff;
--card:#221832;
--accent:#9b5cff;
}

body.blue{
--bg:#0d1b2a;
--sidebar:#13293d;
--text:#ffffff;
--card:#1b3358;
--accent:#00b4ff;
}

body.gold{
--bg:#1a1400;
--sidebar:#261c00;
--text:#ffffff;
--card:#2d2200;
--accent:#ffc300;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}

body{
background:var(--bg);
color:var(--text);
display:flex;
height:100vh;
overflow:hidden;
transition:.3s;
}

#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
opacity:0;
pointer-events:none;
transition:.3s;
}

#overlay.active{
opacity:1;
pointer-events:auto;
}

#sidebar{
position:fixed;
left:-300px;
top:0;
width:280px;
height:100%;
background:var(--sidebar);
padding:20px;
transition:.4s;
display:flex;
flex-direction:column;
z-index:1000;
}

#sidebar.active{
left:0;
}

.hamburger{
position:absolute;
top:20px;
left:20px;
width:30px;
height:22px;
cursor:pointer;
display:flex;
flex-direction:column;
justify-content:space-between;
z-index:2000;
}

.hamburger span{
height:4px;
background:var(--text);
border-radius:4px;
transition:.4s;
}

.hamburger.active span:nth-child(1){
transform:rotate(45deg) translate(5px,5px);
}

.hamburger.active span:nth-child(2){
opacity:0;
}

.hamburger.active span:nth-child(3){
transform:rotate(-45deg) translate(6px,-6px);
}

#main{
flex:1;
display:flex;
flex-direction:column;
width:100%;
}

.header{
padding:20px;
text-align:center;
font-size:20px;
font-weight:600;
}

#chatArea{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
background:var(--card);
padding:12px;
border-radius:12px;
margin-bottom:10px;
animation:fade .3s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.chatbar{
display:flex;
padding:15px;
background:var(--sidebar);
gap:10px;
}

.chatbar input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:var(--card);
color:var(--text);
}

.icon-btn{
width:40px;
height:40px;
border-radius:10px;
background:var(--card);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
}

.icon-btn:hover{
transform:scale(1.1);
}

select,button{
background:var(--card);
color:var(--text);
border:none;
padding:8px;
border-radius:8px;
margin-top:10px;
width:100%;
}

.modal{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:var(--sidebar);
padding:20px;
border-radius:15px;
width:300px;
z-index:3000;
transition:.3s;
}

.modal.active{
transform:translate(-50%,-50%) scale(1);
}
</style>
</head>
<body>

<div id="overlay"></div>

<div id="sidebar">
<h3>BotFusion AI</h3>
<button onclick="newChat()">+ New Chat</button>
<div id="chatList"></div>
<hr>
<button onclick="openSettings()">Settings</button>
<button onclick="openAccount()">Account</button>
<button onclick="openReport()">Report</button>
<button onclick="logout()">Logout</button>
</div>

<div class="hamburger" id="hamburger" onclick="toggleSidebar()">
<span></span>
<span></span>
<span></span>
</div>

<div id="main">
<div class="header">BotFusion AI</div>

<div id="chatArea"></div>

<div class="chatbar">
<div class="icon-btn" onclick="uploadFile()">
<svg width="20" height="20" fill="var(--accent)">
<path d="M10 0v12M5 5l5-5 5 5"/>
</svg>
</div>

<input id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendMessage()">

<div class="icon-btn" onclick="voiceInput()">
<svg width="20" height="20" fill="var(--accent)">
<circle cx="10" cy="6" r="4"/>
<rect x="8" y="10" width="4" height="6"/>
</svg>
</div>

<div class="icon-btn" onclick="sendMessage()">
<svg width="20" height="20" fill="var(--accent)">
<polygon points="0,10 20,0 15,20"/>
</svg>
</div>
</div>
</div>

<div id="settingsModal" class="modal">
<h3>Settings</h3>
<label>Theme</label>
<select onchange="changeTheme(this.value)">
<option value="">Default (Black)</option>
<option value="light">Light</option>
<option value="purple">Purple</option>
<option value="blue">Blue</option>
<option value="gold">Gold</option>
</select>

<label>Language</label>
<select id="languageSelect"></select>

<button onclick="closeModal()">Close</button>
</div>

<div id="accountModal" class="modal">
<h3>Account</h3>
<button onclick="googleLogin()">Login with Google</button>
<button onclick="guestMode()">Continue as Guest</button>
<button onclick="closeModal()">Close</button>
</div>

<div id="reportModal" class="modal">
<h3>Report Issue</h3>
<textarea style="width:100%;height:80px;background:var(--card);color:var(--text);border:none;border-radius:8px;"></textarea>
<button onclick="closeModal()">Submit</button>
</div>

<script>
const firebaseConfig={
apiKey: "AIzaSyDA62eN5MEjX9Z-gw6w9UuR8L-Ke_6J7eE",
  authDomain: "botfusion-ai-bd6d0.firebaseapp.com",
  projectId: "botfusion-ai-bd6d0",
  storageBucket: "botfusion-ai-bd6d0.firebasestorage.app",
  messagingSenderId: "730477136598",
  appId: "1:730477136598:web:c6b4e0d495744d12079777",
  measurementId: "G-53FTWNQB8X"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

function googleLogin(){
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}

function logout(){auth.signOut();}

function guestMode(){alert("Guest Mode Activated");}

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("active");
document.getElementById("overlay").classList.toggle("active");
document.getElementById("hamburger").classList.toggle("active");
}

document.getElementById("overlay").onclick=toggleSidebar;

function sendMessage(){
const input=document.getElementById("chatInput");
if(!input.value)return;
const msg=document.createElement("div");
msg.className="message";
msg.innerText=input.value;
document.getElementById("chatArea").appendChild(msg);
input.value="";
}

function changeTheme(theme){
document.body.className=theme;
}

function openSettings(){document.getElementById("settingsModal").classList.add("active");}
function openAccount(){document.getElementById("accountModal").classList.add("active");}
function openReport(){document.getElementById("reportModal").classList.add("active");}
function closeModal(){document.querySelectorAll(".modal").forEach(m=>m.classList.remove("active"));}

function uploadFile(){alert("Upload backend pending");}
function voiceInput(){alert("Voice backend pending");}
function newChat(){alert("New Chat Created");}

const languages=[
"English","Hindi","Spanish","French","German","Chinese","Arabic","Russian","Japanese","Portuguese",
"Bengali","Urdu","Turkish","Italian","Korean","Dutch","Greek","Polish","Swedish","Thai",
"Vietnamese","Malay","Indonesian","Hebrew","Czech","Romanian","Hungarian","Finnish","Danish","Norwegian",
"Slovak","Ukrainian","Croatian","Serbian","Tamil","Telugu","Punjabi","Gujarati","Marathi","Nepali",
"Filipino","Swahili","Zulu","Afrikaans","Icelandic","Irish","Welsh","Persian","Pashto","Sinhala"
];

const select=document.getElementById("languageSelect");
languages.forEach(lang=>{
const option=document.createElement("option");
option.textContent=lang;
select.appendChild(option);
});
</script>

</body>
  </html>
