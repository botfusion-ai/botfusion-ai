<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Botfusion AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,Segoe UI;
  background:#f7f7f8;color:#1f2937;
  height:100vh;display:flex
}

/* SIDEBAR */
.sidebar{
  width:260px;background:#fff;border-right:1px solid #e5e7eb;padding:16px
}
.sidebar h1{font-size:18px;margin-bottom:14px}
.new-chat{
  width:100%;padding:10px;border-radius:8px;
  border:1px solid #e5e7eb;background:#fafafa;cursor:pointer
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{
  height:56px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;
  border-bottom:1px solid #e5e7eb;background:#fff
}
.top-right{display:flex;align-items:center;gap:12px}

/* CHAT */
.chat{flex:1;overflow-y:auto;padding:32px 0}
.chat-inner{max-width:720px;margin:auto;padding:0 20px}
.message{margin-bottom:28px;line-height:1.6}
.user{font-weight:500}
.ai{color:#111827}

/* INPUT */
.input-area{
  border-top:1px solid #e5e7eb;
  padding:16px;background:#fff
}
.input-inner{
  max-width:720px;margin:auto;display:flex;gap:12px
}
input{
  flex:1;padding:12px 14px;border-radius:10px;
  border:1px solid #d1d5db;font-size:15px
}
button{
  padding:12px 16px;border-radius:10px;
  border:none;background:#111827;color:#fff;cursor:pointer
}

/* SETTINGS MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center
}
.modal-box{
  width:360px;background:#fff;
  border-radius:12px;padding:20px
}
.modal h3{margin-bottom:12px}
.modal label{font-size:14px;margin-top:10px;display:block}
.modal select{width:100%;padding:8px;margin-top:4px}

/* DARK MODE */
body.dark{background:#0f172a;color:#e5e7eb}
body.dark .sidebar,
body.dark .topbar,
body.dark .input-area,
body.dark .modal-box{
  background:#020617;border-color:#1e293b
}
body.dark input{
  background:#020617;color:#e5e7eb;border-color:#1e293b
}
body.dark .ai{color:#e5e7eb}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h1>Botfusion AI</h1>
  <button class="new-chat">＋ New chat</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP -->
  <div class="topbar">
    <div>Botfusion-AI</div>
    <div class="top-right">
      <span style="cursor:pointer" onclick="openSettings()">⚙️</span>
      <div id="userArea">
        <div id="g_id_onload"
          data-client_id="29653421578-hmm842utpcu63hdq8k43inonfid852ed.apps.googleusercontent.com"
          data-callback="onLogin"></div>
        <div class="g_id_signin"></div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat">
    <div class="chat-inner" id="chatInner">
      <div class="message ai">
        Hello. I’m Botfusion-AI. How can I help you today?
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-inner">
      <input id="input" placeholder="Message Botfusion-AI…" />
      <button onclick="send()">Send</button>
    </div>
  </div>

</div>

<!-- SETTINGS -->
<div class="modal" id="settings">
  <div class="modal-box">
    <h3>Settings</h3>

    <label>Theme</label>
    <select onchange="setTheme(this.value)">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>

    <label>AI Role</label>
    <select onchange="setRole(this.value)">
      <option>General AI</option>
      <option>Teacher AI</option>
      <option>Student AI</option>
      <option>Developer AI</option>
      <option>Business AI</option>
      <option>Child Safe AI</option>
    </select>

    <button style="margin-top:14px;width:100%" onclick="closeSettings()">
      Close
    </button>
  </div>
</div>

<script>
let role="General AI";

/* SEND */
function send(){
  const i=input;
  if(!i.value) return;
  add("user",i.value);

  streamAI(
    "Here is a thoughtful response generated according to your selected role. " +
    "This text is streamed gradually to feel natural and calm, just like a real AI."
  );
  i.value="";
}

/* ADD MESSAGE */
function add(type,text){
  const d=document.createElement("div");
  d.className="message "+type;
  d.textContent=text;
  chatInner.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

/* STREAMING RESPONSE */
function streamAI(text){
  const d=document.createElement("div");
  d.className="message ai";
  chatInner.appendChild(d);

  let i=0;
  const interval=setInterval(()=>{
    d.textContent+=text[i++];
    chat.scrollTop=chat.scrollHeight;
    if(i>=text.length) clearInterval(interval);
  },25);
}

/* SETTINGS */
function openSettings(){settings.style.display="flex"}
function closeSettings(){settings.style.display="none"}
function setTheme(t){document.body.className=t==="dark"?"dark":""}
function setRole(r){role=r}

/* GOOGLE LOGIN */
function onLogin(res){
  const u=JSON.parse(atob(res.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  userArea.innerHTML=`
    <img src="${u.picture}" width="28" style="border-radius:50%">
    ${u.name}
  `;
}
</script>

</body>
</html>
