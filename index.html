<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>

<style>
:root{
--bg:#0f0f14;
--panel:#17171c;
--border:rgba(255,255,255,0.08);
--user:#2563eb;
--bot:#1e1e24;
--text:#ffffff;
--subtle:#9ca3af;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui}
body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
overflow:hidden;
transition:background 0.3s ease;
}

/* Sidebar */
.sidebar{
width:260px;
background:var(--panel);
border-right:1px solid var(--border);
display:flex;
flex-direction:column;
transition:0.3s;
}
.sidebar.collapsed{width:70px}

.topbar{
padding:14px;
font-weight:600;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
}

.icon-btn{
cursor:pointer;
font-size:14px;
color:var(--subtle);
}

.chat-list{flex:1;overflow-y:auto}
.chat-item{
padding:12px;
border-bottom:1px solid var(--border);
cursor:pointer;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.chat-item.active{background:#1f1f26}
.chat-item:hover{background:#22222a}

/* Main */
.main{flex:1;display:flex;flex-direction:column;position:relative}

.header{
height:60px;
display:flex;
align-items:center;
justify-content:center;
background:var(--panel);
border-bottom:1px solid var(--border);
font-weight:600;
}

.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
}

.message{
max-width:75%;
padding:12px 14px;
border-radius:14px;
margin-bottom:10px;
font-size:14px;
line-height:1.5;
animation:fadeUp 0.2s ease;
}
.user{
background:var(--user);
margin-left:auto;
border-bottom-right-radius:4px;
}
.bot{
background:var(--bot);
border-bottom-left-radius:4px;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:translateY(0)}
}

.input-area{
padding:12px;
background:var(--panel);
border-top:1px solid var(--border);
display:flex;
align-items:flex-end;
}

textarea{
flex:1;
resize:none;
border:none;
outline:none;
background:#1c1c22;
color:white;
padding:10px 12px;
border-radius:12px;
font-size:14px;
max-height:120px;
overflow-y:auto;
}

.send{
width:40px;
margin-left:8px;
cursor:pointer;
transition:0.2s;
}
.send:hover{transform:translateX(3px)}
svg{fill:white}

.scroll-btn{
position:absolute;
bottom:90px;
right:20px;
background:#222;
padding:8px 12px;
border-radius:20px;
cursor:pointer;
display:none;
font-size:12px;
}
.scroll-btn.show{display:block}

/* Elegant Themes */
.theme-ocean{--bg:#001f3f}
.theme-royal{--bg:#1a0025}
.theme-crimson{--bg:#250000}
.theme-emerald{--bg:#002b20}
.theme-graphite{--bg:#111111}
.theme-slate{--bg:#1a1f2b}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
<div class="topbar">
<span id="newChatLabel">New Chat</span>
<span class="icon-btn" onclick="createChat()">＋</span>
</div>

<div style="padding:10px;border-bottom:1px solid var(--border)">
<select id="themeSelect" onchange="changeTheme(this.value)">
<option value="">Obsidian</option>
<option value="theme-ocean">Ocean</option>
<option value="theme-royal">Royal</option>
<option value="theme-crimson">Crimson</option>
<option value="theme-emerald">Emerald</option>
<option value="theme-graphite">Graphite</option>
<option value="theme-slate">Slate</option>
</select>

<br><br>

<select id="languageSelect" onchange="changeLanguage(this.value)">
</select>
</div>

<div class="chat-list" id="chatList"></div>
</div>

<div class="main">
<div class="header">BotFusion AI</div>
<div class="chat" id="chat"></div>
<div class="scroll-btn" id="scrollBtn" onclick="scrollBottom()">▼</div>
<div class="input-area">
<textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
<div class="send" onclick="sendMessage()">
<svg viewBox="0 0 24 24">
<path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
</svg>
</div>
</div>
</div>

<script>
let chats=JSON.parse(localStorage.getItem("bf_chats"))||[];
let currentChat=null;

const chatEl=document.getElementById("chat");
const chatList=document.getElementById("chatList");
const input=document.getElementById("input");
const scrollBtn=document.getElementById("scrollBtn");
const languageSelect=document.getElementById("languageSelect");

/* 100+ Languages */
const languages=["English","Spanish","French","German","Italian","Portuguese","Russian","Chinese","Japanese","Korean","Hindi","Arabic","Bengali","Urdu","Turkish","Dutch","Polish","Thai","Vietnamese","Indonesian","Malay","Greek","Hebrew","Swedish","Norwegian","Danish","Finnish","Ukrainian","Romanian","Hungarian","Czech","Slovak","Bulgarian","Serbian","Croatian","Slovenian","Lithuanian","Latvian","Estonian","Filipino","Swahili","Afrikaans","Icelandic","Irish","Welsh","Nepali","Sinhala","Tamil","Telugu","Kannada","Malayalam","Punjabi","Marathi","Gujarati","Odia","Assamese","Khmer","Lao","Mongolian","Persian","Pashto","Kazakh","Uzbek","Azerbaijani","Georgian","Armenian","Albanian","Macedonian","Bosnian","Malagasy","Haitian Creole","Yoruba","Zulu","Amharic","Somali","Tajik","Kurdish","Luxembourgish","Catalan","Basque","Galician","Esperanto","Fijian","Samoan","Tongan","Maori","Quechua","Aymara","Hausa","Igbo","Xhosa","Guarani","Latvian","Slovenian","Turkmen","Kyrgyz"];

languages.forEach(l=>{
let opt=document.createElement("option");
opt.textContent=l;
languageSelect.appendChild(opt);
});

function save(){localStorage.setItem("bf_chats",JSON.stringify(chats));}

function createChat(){
const id=Date.now();
chats.unshift({id,title:"New Conversation",messages:[]});
currentChat=id;
save();renderChats();renderMessages();
}

function renderChats(){
chatList.innerHTML="";
chats.forEach(c=>{
let div=document.createElement("div");
div.className="chat-item"+(c.id===currentChat?" active":"");
div.textContent=c.title;
div.onclick=()=>{currentChat=c.id;renderChats();renderMessages();}
div.oncontextmenu=(e)=>{
e.preventDefault();
let name=prompt("Rename chat:",c.title);
if(name){c.title=name;save();renderChats();}
};
chatList.appendChild(div);
});
}

function renderMessages(){
chatEl.innerHTML="";
let chatObj=chats.find(c=>c.id===currentChat);
if(!chatObj)return;
chatObj.messages.forEach(m=>{
let div=document.createElement("div");
div.className="message "+m.role;
div.innerHTML=formatText(m.text);
chatEl.appendChild(div);
});
scrollBottom();
}

function sendMessage(){
if(!input.value.trim())return;
let chatObj=chats.find(c=>c.id===currentChat);
chatObj.messages.push({role:"user",text:input.value});
renderMessages();

let botMsg={role:"bot",text:""};
chatObj.messages.push(botMsg);
renderMessages();

let full="Advanced frontend AI response simulation.";
let i=0;
let interval=setInterval(()=>{
botMsg.text+=full[i];
renderMessages();
i++;
if(i>=full.length){clearInterval(interval);save();}
},25);

input.value="";
input.style.height="auto";
save();
}

function formatText(text){
return text.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
}

function scrollBottom(){
chatEl.scrollTop=chatEl.scrollHeight;
scrollBtn.classList.remove("show");
}

chatEl.addEventListener("scroll",()=>{
if(chatEl.scrollTop+chatEl.clientHeight<chatEl.scrollHeight-50){
scrollBtn.classList.add("show");
}else{scrollBtn.classList.remove("show");}
});

input.addEventListener("input",()=>{
input.style.height="auto";
input.style.height=input.scrollHeight+"px";
});

input.addEventListener("keydown",(e)=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

function changeTheme(theme){
document.body.className=theme;
localStorage.setItem("bf_theme",theme);
}

function changeLanguage(lang){
localStorage.setItem("bf_lang",lang);
}

window.onload=()=>{
let savedTheme=localStorage.getItem("bf_theme");
if(savedTheme)document.body.className=savedTheme;
if(chats.length===0)createChat();
else{currentChat=chats[0].id;renderChats();renderMessages();}
}
</script>

</body>
 </html>
