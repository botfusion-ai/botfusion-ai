<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Botfusion-AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Login -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,system-ui}
body{height:100vh;display:flex;flex-direction:column}

/* ===== THEMES ===== */
body.dark{--bg:#0f1117;--panel:#161a23;--text:#eaeaf0;--border:#262b3a;--hover:#20263a;--accent:#4f7cff}
body.light{--bg:#f5f7fb;--panel:#fff;--text:#1e1e2e;--border:#dcdfea;--hover:#eef1f8;--accent:#3b6cff}
body.glass{--bg:#1b1e2b;--panel:rgba(255,255,255,.08);--text:#fff;--border:rgba(255,255,255,.2);--hover:rgba(255,255,255,.12);--accent:#7c9cff}
body.cyber{--bg:#05080d;--panel:#0b1220;--text:#00ffcc;--border:#003333;--hover:#001f1f;--accent:#00ffaa}
body.warm{--bg:#f6efe9;--panel:#fff7f0;--text:#3a2e2a;--border:#e2d6cc;--hover:#f0e4da;--accent:#d47c4a}

body{background:var(--bg);color:var(--text);transition:.3s}

/* ===== HEADER ===== */
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
select,button,input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px}
button:hover{background:var(--hover);cursor:pointer}

/* ===== LAYOUT ===== */
.container{flex:1;display:flex}
.sidebar{width:240px;padding:14px;background:var(--panel);border-right:1px solid var(--border)}
.chat-area{flex:1;display:flex;flex-direction:column}

/* ===== CHAT ===== */
.messages{flex:1;padding:16px;overflow-y:auto}
.msg{max-width:70%;padding:12px;border-radius:12px;margin-bottom:10px}
.bot{background:var(--panel)}
.user{background:var(--accent);color:#fff;margin-left:auto}
.input-area{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border);background:var(--panel)}
input{flex:1}

/* ===== UTIL ===== */
.badge{font-size:12px;opacity:.7}
.hidden{display:none}
</style>
</head>

<body class="dark">

<header>
  <strong>🤖 Botfusion-AI</strong>

  <div style="display:flex;gap:8px;align-items:center">

    <!-- THEME -->
    <select onchange="setTheme(this.value)">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="glass">Glass</option>
      <option value="cyber">Cyber</option>
      <option value="warm">Warm</option>
    </select>

    <!-- LANGUAGE -->
    <select onchange="setLanguage(this.value)">
      <option>English</option>
      <option>Hindi</option>
      <option>Marathi</option>
      <option>Tamil</option>
      <option>Telugu</option>
      <option>Bengali</option>
      <option>Urdu</option>
    </select>

    <!-- ROLE -->
    <select onchange="setRole(this.value)">
      <option>General AI</option>
      <option>Teacher AI</option>
      <option>Student AI</option>
      <option>Developer AI</option>
      <option>Business AI</option>
      <option>Child Safe AI</option>
    </select>

    <!-- USER -->
    <div id="userArea">
      <div id="g_id_onload"
        data-client_id="YOUR_GOOGLE_CLIENT_ID"
        data-callback="onLogin">
      </div>
      <div class="g_id_signin"></div>
    </div>
  </div>
</header>

<div class="container">

  <aside class="sidebar">
    <h4>Chats</h4>
    <div class="badge">AI Operating System</div>
  </aside>

  <main class="chat-area">
    <div class="messages" id="messages">
      <div class="msg bot">Hello 👋 I am Botfusion-AI</div>
    </div>

    <div class="input-area">
      <input id="input" placeholder="Type your message…" />
      <button onclick="send()">Send</button>
    </div>
  </main>

</div>

<script>
let role="General AI", lang="English";

/* THEME */
function setTheme(t){document.body.className=t}

/* LANGUAGE */
function setLanguage(l){lang=l;system(`Language set to ${l}`)}

/* ROLE */
function setRole(r){role=r;system(`Role switched to ${r}`)}

/* CHAT */
function send(){
  const i=document.getElementById("input");
  if(!i.value) return;
  add("user",i.value);
  add("bot",`(${role}, ${lang}) Processing your request…`);
  i.value="";
}

/* UI MSG */
function add(type,text){
  const m=document.createElement("div");
  m.className="msg "+type;
  m.textContent=text;
  messages.appendChild(m);
  messages.scrollTop=9999;
}
function system(t){add("bot","⚙️ "+t)}

/* GOOGLE LOGIN */
function onLogin(res){
  const u=parseJwt(res.credential);
  userArea.innerHTML=`
    <span>${u.name}</span>
    <img src="${u.picture}" width="32" style="border-radius:50%">
    <button onclick="logout()">Logout</button>`;
}
function logout(){location.reload()}

/* JWT */
function parseJwt(t){
  return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
}
</script>

</body>
</html>
