<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotFusion AI</title>

<style>
/* ---------- THEME VARIABLES ---------- */
:root{
  --bg:#1e1e1e;
  --panel:#2a2a2a;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#2f2f2f;
}

/* ---------- BASE ---------- */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* ---------- HEADER ---------- */
.header{
  height:56px;
  display:flex;
  align-items:center;
  padding:0 16px;
  background:#111;
}

.menu-btn{
  font-size:24px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  position:fixed;
  top:0;
  left:-280px;
  width:280px;
  height:100%;
  background:var(--panel);
  padding:16px;
  transition:0.3s ease;
  z-index:1000;
  overflow-y:auto;
}

.sidebar.active{ left:0; }

.sidebar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  font-size:22px;
  cursor:pointer;
}

.sidebar button, .sidebar select{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3a3a3a;
  color:white;
  cursor:pointer;
}

.sidebar h4{
  margin-top:18px;
  margin-bottom:6px;
  font-size:14px;
  opacity:.8;
}

/* ---------- MAIN ---------- */
.main{
  height:calc(100vh - 112px);
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.empty-state{
  text-align:center;
  opacity:.9;
}

.empty-state h2{
  margin-top:10px;
}

/* ---------- FOOTER ---------- */
.footer{
  height:56px;
  padding:8px;
  background:#111;
  display:flex;
  align-items:center;
  gap:8px;
}

.footer input{
  flex:1;
  padding:12px 14px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
  outline:none;
}

.footer button{
  border:none;
  cursor:pointer;
}

.attach-btn{
  background:none;
  color:white;
  font-size:20px;
}

.send-btn{
  background:var(--accent);
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:18px;
}

/* ---------- THEMES ---------- */
.light{--bg:#f4f4f4;--panel:#ffffff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>BotFusion AI</h3>
    <div class="close-btn" onclick="toggleMenu()">✖</div>
  </div>

  <button onclick="newChat()">➕ New Chat</button>
  <button>🕘 History</button>

  <h4>Settings</h4>
  <label>Theme</label>
  <select onchange="setTheme(this.value)">
    <option value="">Default</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <label>Language</label>
  <select>
    <option>English</option>
    <option>Hindi</option>
    <option>Marathi</option>
    <option>Spanish</option>
    <option>French</option>
  </select>

  <h4>More</h4>
  <button>🔐 Google Login</button>
  <button>❓ Help</button>
  <button>🚩 Report</button>
  <button>ℹ About BotFusion</button>

  <p style="font-size:12px;opacity:.6;margin-top:12px;">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="empty-state" id="emptyState">
    <div style="font-size:40px">⬢</div>
    <h2>How can I help you today?</h2>
    <p>Start typing to begin a new chat</p>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <button class="attach-btn">📎</button>
  <input id="chatInput" placeholder="Message BotFusion..." oninput="startChat()" />
  <button class="send-btn">↑</button>
</div>

<script>
function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('active');
}

function setTheme(theme){
  document.body.className = theme;
}

function newChat(){
  document.getElementById('emptyState').style.display='block';
  document.getElementById('chatInput').value='';
  toggleMenu();
}

function startChat(){
  document.getElementById('emptyState').style.display='none';
}
</script>

</body>
</html>
