<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botfusion AI v2</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#0f172a;
 --sidebar:#111827;
 --chat:#1e293b;
 --text:#ffffff;
 --accent:#10a37f;
 --transition:0.3s;
}

body{
 margin:0;
 font-family:'Inter',sans-serif;
 background:var(--bg);
 color:var(--text);
 display:flex;
 height:100vh;
 overflow:hidden;
 transition:var(--transition);
}

/* Sidebar */
.sidebar{
 position:fixed;
 left:-260px;
 width:260px;
 height:100%;
 background:var(--sidebar);
 padding:15px;
 transition:var(--transition);
 display:flex;
 flex-direction:column;
 z-index:10;
}

.sidebar.active{ left:0; }

.sidebar h2{ margin:0 0 15px; }

.sidebar button, select{
 margin:5px 0;
 padding:10px;
 border:none;
 border-radius:8px;
 background:none;
 color:var(--text);
 cursor:pointer;
 text-align:left;
}

.sidebar button:hover{ background:#1f2937; }

.hamburger{
 position:absolute;
 top:15px;
 left:15px;
 font-size:22px;
 cursor:pointer;
 z-index:20;
}

/* Chat Area */
.chat-container{
 flex:1;
 display:flex;
 flex-direction:column;
 margin-left:0;
 width:100%;
}

.messages{
 flex:1;
 overflow-y:auto;
 padding:70px 20px 20px 20px;
 display:flex;
 flex-direction:column;
}

.message{
 padding:12px 16px;
 margin:8px 0;
 border-radius:14px;
 max-width:75%;
 animation:fade 0.3s ease;
}

.user{ background:var(--accent); align-self:flex-end; }
.bot{ background:#374151; }

@keyframes fade{
 from{opacity:0; transform:translateY(10px);}
 to{opacity:1; transform:translateY(0);}
}

/* Chatbar */
.chatbar{
 display:flex;
 padding:15px;
 background:var(--sidebar);
}

.chatbar input{
 flex:1;
 padding:12px;
 border-radius:8px;
 border:none;
 outline:none;
}

.chatbar button{
 margin-left:8px;
 padding:12px;
 border:none;
 border-radius:8px;
 background:var(--accent);
 color:white;
 cursor:pointer;
}

/* Modal */
.modal{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:rgba(0,0,0,0.5);
 display:none;
 justify-content:center;
 align-items:center;
}
.modal-content{
 background:var(--chat);
 padding:20px;
 border-radius:12px;
 width:90%;
 max-width:400px;
}
.modal.active{ display:flex; }

/* Themes */
.theme-light{
 --bg:#ffffff;
 --sidebar:#f3f4f6;
 --chat:#ffffff;
 --text:#000000;
 --accent:#2563eb;
}
.theme-blue{
 --bg:#0a192f;
 --sidebar:#112240;
 --chat:#172a45;
 --text:#ccd6f6;
 --accent:#64ffda;
}
.theme-purple{
 --bg:#1e1b4b;
 --sidebar:#312e81;
 --chat:#3730a3;
 --text:#ffffff;
 --accent:#a78bfa;
}
.theme-minimal{
 --bg:#f9fafb;
 --sidebar:#e5e7eb;
 --chat:#ffffff;
 --text:#111827;
 --accent:#10b981;
}
</style>
</head>

<body>

<div class="hamburger" onclick="toggleSidebar()">☰</div>

<div class="sidebar" id="sidebar">
<h2>Botfusion AI</h2>
<button onclick="newChat()">+ New Chat</button>
<button onclick="createFolder()">+ Create Folder</button>
<div id="folders"></div>
<hr>
<button onclick="openAccount()">Account</button>
<button onclick="openSettings()">Settings</button>
<button onclick="reportIssue()">Report</button>
<select id="languageSelect"></select>
<button onclick="switchTheme()">Switch Theme</button>
</div>

<div class="chat-container">
<div class="messages" id="messages"></div>

<div class="chatbar">
<button onclick="document.getElementById('fileInput').click()">📎</button>
<input type="file" id="fileInput" hidden>
<button onclick="startVoice()">🎤</button>
<input type="text" id="input" placeholder="Send a message...">
<button onclick="send()">Send</button>
</div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
<div class="modal-content">
<h3>Settings</h3>
<p>Theme & Language auto-save enabled.</p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<!-- Account Modal -->
<div class="modal" id="accountModal">
<div class="modal-content">
<h3>Account</h3>
<p>Guest Mode Active</p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>
/* Sidebar */
function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("active");
}

/* Chat */
function send(){
 let text=document.getElementById("input").value;
 if(!text) return;
 addMessage(text,"user");
 document.getElementById("input").value="";
 setTimeout(()=>{
   let reply="Botfusion AI upgraded response.";
   addMessage(reply,"bot");
   speak(reply);
 },800);
}

function addMessage(text,type){
 let div=document.createElement("div");
 div.className="message "+type;
 div.innerText=text;
 document.getElementById("messages").appendChild(div);
}

/* Folders */
function createFolder(){
 let name=prompt("Folder name:");
 if(!name) return;
 let div=document.createElement("div");
 div.innerText="📁 "+name;
 document.getElementById("folders").appendChild(div);
}

/* Theme */
let themes=["","theme-light","theme-blue","theme-purple","theme-minimal"];
let themeIndex=localStorage.getItem("themeIndex")||0;
document.body.className=themes[themeIndex];

function switchTheme(){
 themeIndex=(parseInt(themeIndex)+1)%themes.length;
 document.body.className=themes[themeIndex];
 localStorage.setItem("themeIndex",themeIndex);
}

/* Language */
let languages=["English","Hindi","Marathi","Spanish","French","German","Chinese","Japanese","Arabic","Bengali","Punjabi","Tamil","Telugu","Gujarati","Malayalam","Urdu"];
let select=document.getElementById("languageSelect");
languages.forEach(l=>{
 let option=document.createElement("option");
 option.text=l;
 select.add(option);
});
select.value=localStorage.getItem("language")||"English";
select.onchange=function(){
 localStorage.setItem("language",select.value);
};

/* Voice */
function startVoice(){
 const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
 recognition.lang="en-US";
 recognition.start();
 recognition.onresult=function(e){
  document.getElementById("input").value=e.results[0][0].transcript;
 };
}

/* Speech */
function speak(text){
 const speech=new SpeechSynthesisUtterance(text);
 speechSynthesis.speak(speech);
}

/* Modals */
function openSettings(){ document.getElementById("settingsModal").classList.add("active"); }
function openAccount(){ document.getElementById("accountModal").classList.add("active"); }
function closeModal(){
 document.querySelectorAll(".modal").forEach(m=>m.classList.remove("active"));
}

function reportIssue(){
 let issue=prompt("Describe issue:");
 if(issue) alert("Reported: "+issue);
}

function newChat(){
 document.getElementById("messages").innerHTML="";
}
</script>

</body>
 </html>
