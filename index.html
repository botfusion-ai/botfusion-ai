<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotFusion AI</title>

<style>
/* ================= ROOT THEMES ================= */
:root{
  --bg:#0f0f0f;
  --panel:#1c1c1c;
  --text:#ffffff;
  --accent:#19c37d;
  --card:#2a2a2a;
}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* ================= HEADER ================= */
.header{
  display:flex;
  align-items:center;
  padding:14px;
  background:#000;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-weight:600;
  font-size:18px;
}

/* ================= SIDEBAR ================= */
.sidebar{
  position:fixed;
  top:0;
  left:-100%;
  width:260px;
  height:100%;
  background:var(--panel);
  padding:20px;
  transition:0.3s ease;
  z-index:1000;
}

.sidebar.active{
  left:0;
}

.close-btn{
  font-size:20px;
  cursor:pointer;
  text-align:right;
}

.sidebar h3{
  margin-top:10px;
}

.sidebar button,
.sidebar select{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3a3a3a;
  color:white;
}

/* ================= MAIN ================= */
.main{
  height:calc(100vh - 120px);
  padding:20px;
  overflow-y:auto;
}

.icon{
  font-size:40px;
  color:var(--accent);
}

.title{
  font-size:22px;
  margin:12px 0;
}

.card{
  background:var(--card);
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
}

/* ================= FOOTER ================= */
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  padding:12px;
  background:#000;
  display:flex;
  align-items:center;
  gap:10px;
}

.file-label{
  font-size:22px;
  cursor:pointer;
}

.footer input[type="text"]{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a2a2a;
  color:white;
}

.footer button{
  background:var(--accent);
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:18px;
  cursor:pointer;
}

/* ================= THEMES ================= */
.light{--bg:#f4f4f4;--panel:#ffffff;--text:#000;--card:#eaeaea;}
.grey{--bg:#2b2b2b;--panel:#3a3a3a;}
.blue{--bg:#0f172a;--panel:#1e293b;--accent:#3b82f6;}
.green{--bg:#0b1a12;--panel:#0f2a1b;--accent:#22c55e;}
.black{--bg:#000;--panel:#111;}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">
  <div class="close-btn" onclick="toggleMenu()">✕</div>
  <h3>BotFusion AI</h3>

  <button onclick="googleLogin()">Google Login</button>

  <label>Theme</label>
  <select onchange="setTheme(this.value)">
    <option value="">Dark (Default)</option>
    <option value="grey">Grey</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="black">Black</option>
  </select>

  <label>Language</label>
  <select>
    <option>English</option>
    <option>Hindi</option>
    <option>Marathi</option>
    <option>Spanish</option>
    <option>French</option>
  </select>

  <button onclick="report()">Report</button>

  <p style="font-size:12px;opacity:.7">
    BotFusion AI does not provide illegal or harmful information.
  </p>
</div>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="logo">BotFusion</div>
</div>

<!-- ================= MAIN ================= -->
<div class="main" id="chat">
  <div class="icon">⬢</div>
  <div class="title">How can I help you today?</div>

  <div class="card">Explain quantum computing in simple terms</div>
  <div class="card">Write a creative story about a robot</div>
  <div class="card">Help me debug my code</div>
</div>

<!-- ================= FOOTER ================= -->
<div class="footer">
  <label class="file-label">📎
    <input type="file" hidden>
  </label>
  <input id="msg" type="text" placeholder="Message BotFusion..." />
  <button onclick="send()">↑</button>
</div>

<script>
const API = "http://localhost:5000";

/* Sidebar */
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("active");
}

/* Theme */
function setTheme(theme){
  document.body.className = theme;
}

/* Google Login */
function googleLogin(){
  window.location.href = API + "/api/auth/google";
}

/* Send Chat */
async function send(){
  const input = document.getElementById("msg");
  if(!input.value) return;

  const res = await fetch(API + "/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:input.value})
  });

  const data = await res.json();
  alert(data.reply);
  input.value="";
}

/* Report */
function report(){
  fetch(API + "/api/report",{method:"POST"});
  alert("Report submitted");
}
</script>

</body>
</html>
