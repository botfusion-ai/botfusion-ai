<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Botfusion AI</title>

<style>
body { margin:0; font-family:Arial; display:flex; height:100vh; background:#0f172a; color:white; }
#sidebar { width:220px; background:#020617; padding:10px; }
#chat { flex:1; padding:15px; overflow:auto; }
.message { padding:10px; margin:5px; border-radius:8px; max-width:70%; }
.user { background:#2563eb; margin-left:auto; }
.bot { background:#1e293b; }
#inputBox { display:flex; padding:10px; background:#020617; }
input, select { padding:10px; margin-right:5px; }
button { padding:10px; background:#22c55e; border:none; cursor:pointer; }
</style>
</head>

<body>

<div id="sidebar">
  <h3>Modes</h3>
  <select id="mode">
    <option value="chat">Chat</option>
    <option value="image">Image</option>
    <option value="photo">Photo</option>
    <option value="file">PDF</option>
  </select>

  <input type="file" id="fileInput">
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="chat"></div>

  <div id="inputBox">
    <input id="input" placeholder="Enter prompt..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const BASE_URL = "https://your-backend.onrender.com";
const chatDiv = document.getElementById("chat");

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.innerText = text;
  chatDiv.appendChild(div);
}

// 🚀 MAIN SWITCH
async function send() {
  const mode = document.getElementById("mode").value;

  if (mode === "chat") chat();
  if (mode === "image") generateImage();
  if (mode === "photo") analyzeImage();
  if (mode === "file") uploadPDF();
}

// 💬 CHAT STREAM
async function chat() {
  const msg = input.value;
  addMessage(msg, "user");

  const res = await fetch(`${BASE_URL}/chat-stream`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg})
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();

  let result = "";
  const div = document.createElement("div");
  div.className="message bot";
  chatDiv.appendChild(div);

  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    result+=decoder.decode(value);
    div.innerText=result;
  }
}

// 🎨 IMAGE
async function generateImage() {
  const prompt = input.value;

  const res = await fetch(`${BASE_URL}/generate-image`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt})
  });

  const data = await res.json();

  const img = document.createElement("img");
  img.src = data.image;
  img.style.maxWidth = "300px";
  chatDiv.appendChild(img);
}

// 📷 IMAGE ANALYSIS (needs URL)
async function analyzeImage() {
  const url = input.value;

  const res = await fetch(`${BASE_URL}/analyze-image`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({image_url:url})
  });

  const data = await res.json();
  addMessage(data.reply, "bot");
}

// 📄 PDF
async function uploadPDF() {
  const file = document.getElementById("fileInput").files[0];
  const form = new FormData();
  form.append("file", file);

  const res = await fetch(`${BASE_URL}/upload-pdf`, {
    method:"POST",
    body:form
  });

  const data = await res.json();
  addMessage(data.summary, "bot");
}
</script>

</body>
</html>
