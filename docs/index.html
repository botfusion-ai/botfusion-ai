<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFusion AI</title>
<link rel="manifest" href="manifest.json">
<style>
/* ---------- THEMES ---------- */
:root {
  --bg-color: #2a2a2a; /* dark default */
  --header-color: #1f1f1f;
  --card-color: #1f1f1f;
  --sidebar-color: #111;
  --btn-color: #2a2a2a;
  --btn-hover: #3a3a3a;
  --text-color: #fff;
}

/* Light theme */
.light { --bg-color: #f2f2f2; --header-color: #e0e0e0; --card-color: #fff; --sidebar-color: #ccc; --btn-color: #ddd; --btn-hover: #bbb; --text-color: #000; }
/* Blue theme */
.blue { --bg-color: #0d1b2a; --header-color: #1b263b; --card-color: #415a77; --sidebar-color: #1b263b; --btn-color: #415a77; --btn-hover: #778da9; --text-color: #fff; }
/* Green theme */
.green { --bg-color: #1b3b1b; --header-color: #2e552e; --card-color: #4a774a; --sidebar-color: #2e552e; --btn-color: #4a774a; --btn-hover: #6aa96a; --text-color: #fff; }
/* Red theme */
.red { --bg-color: #3b1b1b; --header-color: #552e2e; --card-color: #774a4a; --sidebar-color: #552e2e; --btn-color: #774a4a; --btn-hover: #9a6a6a; --text-color: #fff; }

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg-color);
  color: var(--text-color);
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:12px 16px;
  background: var(--header-color);
  position: sticky;
  top:0;
  z-index: 1000;
}
.hamburger{
  font-size:24px;
  cursor:pointer;
  margin-right:12px;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-100%;
  width:300px;
  height:100vh;
  background: var(--sidebar-color);
  transition:0.3s;
  padding:16px;
  overflow-y:auto;
  z-index: 1000;
}
.sidebar.open{ left:0; }
.sidebar .close-btn {
  background:#900;
  width:100%;
  padding:10px;
  margin-bottom:16px;
  border:none;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
}
.sidebar button, .sidebar select {
  width:100%;
  padding:10px;
  margin:6px 0;
  background: var(--btn-color);
  color: var(--text-color);
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.sidebar button:hover, .sidebar select:hover{ background: var(--btn-hover); }

/* HOME CARDS */
.home-cards{
  padding:20px;
}
.card{
  background: var(--card-color);
  padding:18px;
  border-radius:10px;
  margin-bottom:10px;
}

/* PROFILE */
#profile-section{ display:none; padding:20px; }
#profile-info img{
  width:75px; height:75px; border-radius:50%; margin-bottom:10px; object-fit:cover;
}

/* CHAT SCREEN */
#chat-screen{ display:none; padding:20px; }
#messages{ max-height:60vh; overflow-y:auto; margin-bottom:10px; }
#chat-input{ display:flex; }
#chat-input input{ flex:1; padding:10px; border-radius:6px; border:none; margin-right:6px; }
#chat-input button{ padding:10px; border-radius:6px; border:none; background:#4a90e2; color:#fff; cursor:pointer; }
</style>
</head>
<body class="dark">

<!-- HEADER -->
<div class="header">
  <div class="hamburger" onclick="toggleSidebar()">☰</div>
  <h2>BotFusion AI</h2>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="toggleSidebar()">✖ Close</button>
  <button onclick="showHome()">🏠 Home</button>
  <button onclick="startChat()">💬 Start Chatting</button>
  <button onclick="showProfile()">👤 View Profile</button>
  <button onclick="manageAccount()">⚙ Manage Account</button>
  <button onclick="openSettings()">🛠 Settings</button>

  <hr>
  <select id="themeSwitch" onchange="changeTheme(this.value)">
    <option value="dark">Dark</option>
    <option value="light">Light</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="red">Red</option>
  </select>

  <select id="languageSwitch" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <!-- Add 100+ languages -->
  </select>

  <hr>
  <button id="loginBtn" onclick="googleLogin()">🔑 Login with Google</button>
  <button id="logoutBtn" onclick="logout()" style="display:none;">🚪 Logout</button>
</div>

<!-- HOME -->
<div id="home" class="home-cards">
  <div class="card">✨ Start chatting smarter</div>
  <div class="card">🤖 AI help whenever you need</div>
  <div class="card">⚡ Fast, modern experience</div>
</div>

<!-- PROFILE -->
<div id="profile-section">
  <h3>Your Profile</h3>
  <div id="profile-info"></div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <h3>Chat</h3>
  <div id="messages"></div>
  <div id="chat-input">
    <input type="text" id="msgInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- FIREBASE + APP LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* ---------- FIREBASE CONFIG ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDA62eN5MEjX9Z-gw6w9UuR8L-Ke_6J7eE",
  authDomain: "botfusion-ai-bd6d0.firebaseapp.com",
  projectId: "botfusion-ai-bd6d0",
  storageBucket: "botfusion-ai-bd6d0.firebasestorage.app",
  messagingSenderId: "730477136598",
  appId: "1:730477136598:web:c6b4e0d495744d12079777",
  measurementId: "G-53FTWNQB8X"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ---------- ELEMENTS ---------- */
const sidebar = document.getElementById("sidebar");
const home = document.getElementById("home");
const profileSection = document.getElementById("profile-section");
const profileInfo = document.getElementById("profile-info");
const chatScreen = document.getElementById("chat-screen");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* ---------- UI FUNCTIONS ---------- */
window.toggleSidebar = () => sidebar.classList.toggle("open");
window.showHome = () => { home.style.display="block"; profileSection.style.display="none"; chatScreen.style.display="none"; };
window.showProfile = () => { home.style.display="none"; profileSection.style.display="block"; chatScreen.style.display="none"; };
window.startChat = () => { home.style.display="none"; profileSection.style.display="none"; chatScreen.style.display="block"; };
window.manageAccount = () => alert("Manage Account coming soon!");
window.openSettings = () => alert("Settings coming soon!");

/* ---------- GOOGLE LOGIN ---------- */
window.googleLogin = async () => {
  try{ await signInWithPopup(auth, provider); } 
  catch(err){ alert(err.message); }
};
window.logout = async () => { await signOut(auth); };

/* ---------- AUTH STATE ---------- */
onAuthStateChanged(auth, user=>{
  if(user){
    loginBtn.style.display="none";
    logoutBtn.style.display="block";
    profileInfo.innerHTML = `<img src="${user.photoURL||''}"><p><b>${user.displayName}</b></p><p>${user.email}</p>`;
  } else {
    loginBtn.style.display="block";
    logoutBtn.style.display="none";
    profileInfo.innerHTML = "";
  }
});

/* ---------- THEME SWITCH ---------- */
window.changeTheme = (theme) => { document.body.className = theme; };

/* ---------- LANGUAGE SWITCH ---------- */
const translations = {
  en:{ home:"Home", startChat:"Start Chatting", profile:"View Profile", account:"Manage Account", settings:"Settings" },
  hi:{ home:"मुख्य पृष्ठ", startChat:"चैट शुरू करें", profile:"प्रोफ़ाइल देखें", account:"खाता प्रबंधित करें", settings:"सेटिंग्स" },
  es:{ home:"Inicio", startChat:"Comenzar Chat", profile:"Ver Perfil", account:"Administrar Cuenta", settings:"Configuración" },
  fr:{ home:"Accueil", startChat:"Commencer Chat", profile:"Voir Profil", account:"Gérer Compte", settings:"Paramètres" }
  // Add more 100+ languages here
};
window.changeLanguage = (lang)=>{
  const buttons = sidebar.querySelectorAll("button");
  buttons[1].innerText = translations[lang].startChat;
  buttons[2].innerText = translations[lang].profile;
  buttons[3].innerText = translations[lang].account;
  buttons[4].innerText = translations[lang].settings;
  buttons[0].innerText = translations[lang].home;
};

/* ---------- CHAT FUNCTION ---------- */
window.sendMessage = ()=>{
  const input = document.getElementById("msgInput");
  if(input.value.trim()!==""){
    const msgDiv = document.createElement("div");
    msgDiv.textContent = input.value;
    document.getElementById("messages").appendChild(msgDiv);
    input.value="";
    document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
  }
};

/* ---------- PWA SERVICE WORKER ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("/service-worker.js")
      .then(reg => console.log("SW registered", reg))
      .catch(err => console.log("SW failed:", err));
  });
}
</script>
</body>
</html>
