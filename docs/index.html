<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BotFusion AI</title>

<!-- ===================== STYLES ===================== -->
<style>
:root{
  --bg:#0f1115;
  --panel:#161a22;
  --text:#ffffff;
  --accent:#3b82f6;
  --card:#1f2430;
}

/* THEMES */
.theme-dark{--bg:#0f1115;--panel:#161a22;--text:#fff;--accent:#3b82f6;--card:#1f2430;}
.theme-light{--bg:#f4f4f4;--panel:#ffffff;--text:#111;--accent:#2563eb;--card:#e5e7eb;}
.theme-purple{--bg:#12071f;--panel:#1e0f35;--text:#fff;--accent:#a855f7;--card:#2b144f;}
.theme-green{--bg:#071a12;--panel:#0f2a1e;--text:#eafff3;--accent:#22c55e;--card:#143d2b;}
.theme-red{--bg:#1a0707;--panel:#2a0f0f;--text:#fff5f5;--accent:#ef4444;--card:#3a1414;}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:var(--panel);
}
.hamburger{
  font-size:26px;
  cursor:pointer;
}
.title{font-size:18px;font-weight:600}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-100%;
  width:280px;
  height:100vh;
  background:var(--panel);
  padding:16px;
  transition:0.3s;
  z-index:1000;
}
.sidebar.open{left:0}
.sidebar button, .sidebar select{
  width:100%;
  margin:6px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}
.sidebar .close-btn{
  background:#b91c1c;
}
.sidebar hr{border:none;border-top:1px solid #333;margin:10px 0}

/* MAIN */
.main{padding:20px}
.card{
  background:var(--card);
  padding:16px;
  border-radius:12px;
  margin-bottom:12px;
}

/* CHAT */
.chat-screen{display:none}
.chat-box{
  height:60vh;
  overflow:auto;
  background:var(--panel);
  padding:10px;
  border-radius:12px;
}
.input-row{
  display:flex;
  margin-top:10px;
}
.input-row input{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
}
.input-row button{
  margin-left:8px;
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:white;
}

/* PROFILE */
.profile img{width:80px;border-radius:50%}

/* HIDE */
.hidden{display:none}
</style>
</head>

<body class="theme-dark">

<!-- HEADER -->
<div class="header">
  <div class="hamburger" onclick="toggleSidebar()">☰</div>
  <div class="title" data-i18n="title">BotFusion AI</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <button class="close-btn" onclick="toggleSidebar()">✖ Close</button>

  <button onclick="showHome()">🏠 Home</button>
  <button onclick="openChat()">💬 Start Chat</button>
  <button onclick="showProfile()">👤 Profile</button>
  <button onclick="showSettings()">⚙ Settings</button>

  <hr>

  <select onchange="changeTheme(this.value)">
    <option value="theme-dark">Dark</option>
    <option value="theme-light">Light</option>
    <option value="theme-purple">Purple</option>
    <option value="theme-green">Green</option>
    <option value="theme-red">Red</option>
  </select>

  <select onchange="changeLang(this.value)">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="mr">Marathi</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ja">Japanese</option>
    <option value="ru">Russian</option>
    <option value="ar">Arabic</option>
    <!-- You can add more anytime -->
  </select>

  <hr>

  <button id="loginBtn">🔐 Login with Google</button>
  <button id="logoutBtn" class="hidden">🚪 Logout</button>
</div>

<!-- HOME -->
<div class="main" id="home">
  <div class="card" data-i18n="home1">Smart AI Chat Experience</div>
  <div class="card" data-i18n="home2">Fast • Secure • Modern</div>
  <div class="card" data-i18n="home3">Built for the Future</div>
</div>

<!-- CHAT -->
<div class="main chat-screen" id="chat">
  <div class="chat-box" id="chatBox"></div>
  <div class="input-row">
    <input id="chatInput" placeholder="Type message..." />
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<!-- PROFILE -->
<div class="main hidden" id="profile">
  <div class="profile">
    <img id="userPhoto">
    <h3 id="userName"></h3>
    <p id="userEmail"></p>
  </div>
</div>

<!-- SETTINGS -->
<div class="main hidden" id="settings">
  <div class="card">Theme, Language & Account Settings</div>
</div>

<!-- ===================== FIREBASE ===================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA62eN5MEjX9Z-gw6w9UuR8L-Ke_6J7eE",
  authDomain: "botfusion-ai-bd6d0.firebaseapp.com",
  projectId: "botfusion-ai-bd6d0",
  storageBucket: "botfusion-ai-bd6d0.firebasestorage.app",
  messagingSenderId: "730477136598",
  appId: "1:730477136598:web:c6b4e0d495744d12079777"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user=>{
  if(user){
    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    userPhoto.src = user.photoURL;
    userName.textContent = user.displayName;
    userEmail.textContent = user.email;
  }
});
</script>

<!-- ===================== LOGIC ===================== -->
<script>
function toggleSidebar(){sidebar.classList.toggle("open")}
function hideAll(){home.style.display=chat.style.display=profile.style.display=settings.style.display="none"}
function showHome(){hideAll();home.style.display="block"}
function openChat(){hideAll();chat.style.display="block"}
function showProfile(){hideAll();profile.style.display="block"}
function showSettings(){hideAll();settings.style.display="block"}

function changeTheme(t){document.body.className=t}

/* SIMPLE CHAT */
function sendMsg(){
  const msg=chatInput.value;
  if(!msg)return;
  chatBox.innerHTML+=`<div>🧑 ${msg}</div>`;
  chatBox.innerHTML+=`<div>🤖 BotFusion AI is thinking...</div>`;
  chatInput.value="";
}

/* TRANSLATION (SAMPLE, EXTENDABLE TO 100+) */
const dict={
  hi:{title:"बॉटफ्यूजन एआई",home1:"स्मार्ट एआई चैट"},
  mr:{title:"बॉटफ्युजन एआय",home1:"स्मार्ट एआय चॅट"},
  fr:{title:"BotFusion AI"},
  es:{title:"BotFusion AI"}
};
function changeLang(l){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;
    if(dict[l]&&dict[l][k])el.innerText=dict[l][k];
  });
}
</script>

</body>
</html>
