<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botfusion AI</title>

<!-- PWA -->
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">

<style>
:root {
  --bg:#121212;
  --card:#1f1f1f;
  --text:#fff;
  --accent:#ff4444;
}
.light {
  --bg:#f2f2f2;
  --card:#ffffff;
  --text:#000;
}
* { box-sizing:border-box; font-family:system-ui; }
body { margin:0; background:var(--bg); color:var(--text); }

/* Header */
header {
  padding:14px;
  background:var(--card);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* Chat */
#chat {
  height: calc(100vh - 120px);
  overflow-y:auto;
  padding:10px;
}
.msg {
  padding:10px;
  margin:8px 0;
  border-radius:12px;
  max-width:80%;
}
.user { background:var(--accent); margin-left:auto; }
.bot { background:var(--card); }

/* Input */
footer {
  display:flex;
  padding:10px;
  background:var(--card);
}
input[type=text] {
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
}
button {
  margin-left:6px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <b>Botfusion AI</b>
  <button onclick="toggleTheme()">🌗</button>
</header>

<div id="chat">
  <div class="msg bot">Hello 👋 I am Botfusion</div>
</div>

<footer>
  <input id="msg" placeholder="Type message...">
  <input type="file" id="file" hidden>
  <button onclick="document.getElementById('file').click()">📎</button>
  <button onclick="send()">➤</button>
</footer>

<script>
/* Chat */
function send() {
  const input = document.getElementById('msg');
  if(!input.value) return;

  const chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg user">${input.value}</div>`;
  chat.innerHTML += `<div class="msg bot">Received ✅</div>`;
  input.value="";
  chat.scrollTop = chat.scrollHeight;
}

/* Theme */
function toggleTheme(){
  document.body.classList.toggle('light');
}

/* PWA: Manifest */
const manifest = {
  name:"Botfusion AI",
  short_name:"Botfusion",
  start_url:".",
  display:"standalone",
  background_color:"#121212",
  theme_color:"#121212",
  icons:[{
    src:"data:image/png;base64,iVBORw0KGgo=",
    sizes:"192x192",
    type:"image/png"
  }]
};
const blob = new Blob([JSON.stringify(manifest)],{type:'application/json'});
const manifestURL = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel='manifest';
link.href=manifestURL;
document.head.appendChild(link);

/* PWA: Service Worker */
if('serviceWorker' in navigator){
  const swCode = `
    self.addEventListener('install',e=>self.skipWaiting());
    self.addEventListener('fetch',e=>{});
  `;
  const swBlob = new Blob([swCode],{type:'text/javascript'});
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL);
}
</script>

</body>
</html>
